  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  POST-TRAINING TIMELINE  ·  CAPABILITY ACCUMULATION</text>
  <text x="60" y="96" class="h1">2025 was the year the stack got built.</text>
  <text x="60" y="124" class="h-sub">11 of 21 surveyed papers landed in 2025 — the year post-training went from a few recipes to a full stack.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  

  
  <line x1="140" y1="220" x2="140" y2="800" stroke="#2a2a33" stroke-width="1.4"></line>
  <text x="0" y="0" transform="translate(96,510) rotate(-90)" text-anchor="middle" class="layer-tag" fill="#2a2a33">CUMULATIVE POST-TRAINING CAPABILITIES  →</text>

  
  <line x1="140" y1="800" x2="1860" y2="800" stroke="#2a2a33" stroke-width="2" marker-end="url(#ax)"></line>
  <g text-anchor="middle">
