  </g>

  

  
  <path d="M 140 800  L 140 770  L 1832 770  L 1832 800 Z" fill="#a14854" fill-opacity="0.55"></path>

  
  <path d="M 1268 770  L 1268 730  L 1832 730  L 1832 770 Z" fill="#c95a2a" fill-opacity="0.55"></path>

  
