<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  THE ANTI-FORGETTING ZOO</text>
  <text x="60" y="96" class="h1">Five mechanisms across the post-training stack.</text>
  <text x="60" y="124" class="h-sub">Every successful biological post-training paper has an explicit anti-forgetting trick. Five recurring shapes.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
  
  <g>
    <rect x="60" y="200" width="370" height="640" rx="14" fill="#dfeede" stroke="#2c8a4f" stroke-width="1.6"></rect>
    <circle cx="100" cy="240" r="22" fill="#2c8a4f"></circle>
    <text x="100" y="246" text-anchor="middle" class="card-num">1</text>
    <text x="132" y="234" class="card-tag" fill="#2c8a4f">PEFT FAMILY</text>
    <text x="132" y="258" class="card-title">Freeze backbone +</text>
    <text x="132" y="278" class="card-title">train adapters</text>

    
    <g transform="translate(80,310)">
      <rect x="0" y="0" width="330" height="200" rx="10" fill="#efeae0" stroke="#8a8275" stroke-width="1.4"></rect>
      <text x="165" y="34" text-anchor="middle" class="card-tag" fill="#8a8275">FROZEN  ❄</text>
      <line x1="20" y1="60" x2="310" y2="60" stroke="#cfc8b5" stroke-width="1"></line>
      <line x1="20" y1="80" x2="310" y2="80" stroke="#cfc8b5" stroke-width="1"></line>
      
      <rect x="40" y="100" width="60" height="24" rx="3" fill="#2c8a4f"></rect>
      <text x="70" y="116" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">A·B</text>
      <rect x="120" y="100" width="60" height="24" rx="3" fill="#2c8a4f"></rect>
      <text x="150" y="116" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">A·B</text>
      <rect x="200" y="100" width="60" height="24" rx="3" fill="#2c8a4f"></rect>
      <text x="230" y="116" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">A·B</text>
      <line x1="20" y1="148" x2="310" y2="148" stroke="#cfc8b5" stroke-width="1"></line>
      <line x1="20" y1="170" x2="310" y2="170" stroke="#cfc8b5" stroke-width="1"></line>
    </g>

    <text x="80" y="544" class="annot" font-weight="700">examples</text>
    <text x="80" y="566" class="annot">scPEFT  ·  PEFT-PLM</text>
    <text x="80" y="586" class="annot">ColabSaprot adapters</text>

    <line x1="80" y1="610" x2="410" y2="610" stroke="#bcd6bc" stroke-width="1"></line>
    <text x="80" y="638" class="annot" font-weight="700" fill="#2c8a4f">how it preserves the prior</text>
    <text x="80" y="660" class="annot" fill="#5c5c66">the backbone gets no gradient,</text>
    <text x="80" y="680" class="annot" fill="#5c5c66">so the pretrained knowledge</text>
    <text x="80" y="700" class="annot" fill="#5c5c66">cannot be overwritten — only</text>
    <text x="80" y="720" class="annot" fill="#5c5c66">routed around.</text>
    <text x="80" y="758" class="annot" font-style="italic" fill="#5c5c66">the foundational anti-forgetting</text>
    <text x="80" y="778" class="annot" font-style="italic" fill="#5c5c66">recipe in modern bio.</text>
    <text x="80" y="816" class="key" fill="#2c8a4f">~ 0.05 – 5 % params trained</text>
  </g>

  
  <g>
    <rect x="440" y="200" width="370" height="640" rx="14" fill="#fbe6d8" stroke="#c95a2a" stroke-width="1.6"></rect>
    <circle cx="480" cy="240" r="22" fill="#c95a2a"></circle>
    <text x="480" y="246" text-anchor="middle" class="card-num">2</text>
    <text x="512" y="234" class="card-tag" fill="#c95a2a">RL FAMILY</text>
    <text x="512" y="258" class="card-title">Frozen Prior PLM</text>
    <text x="512" y="278" class="card-title">with rubber-band regulariser</text>

    <g transform="translate(460,310)">
      
      <rect x="0" y="0" width="130" height="80" rx="8" fill="#c95a2a" opacity="0.85"></rect>
      <text x="65" y="32" text-anchor="middle" class="card-tag" fill="#ffffff">AGENT ▲</text>
      <text x="65" y="56" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">π_θ</text>

      <rect x="190" y="0" width="130" height="80" rx="8" fill="#efeae0" stroke="#8a8275" stroke-width="1.4" stroke-dasharray="4 3"></rect>
      <text x="255" y="32" text-anchor="middle" class="card-tag" fill="#8a8275">PRIOR ❄</text>
      <text x="255" y="56" text-anchor="middle" class="annot" fill="#1a1a22" font-weight="700">π_ref</text>

      
      <path d="M 130 40 L 144 30 L 156 50 L 168 30 L 180 50 L 190 40" fill="none" stroke="#6b4e8a" stroke-width="2"></path>

      <text x="160" y="120" text-anchor="middle" class="mono" fill="#6b4e8a">L_reg = [log π_θ − log π_ref]²</text>
    </g>

    <text x="460" y="544" class="annot" font-weight="700">examples</text>
    <text x="460" y="566" class="annot">ProteinRL  ·  Gene-R1 KL term</text>
    <text x="460" y="586" class="annot">Cell-o1 reference baseline</text>

    <line x1="460" y1="610" x2="790" y2="610" stroke="#e7c5a8" stroke-width="1"></line>
    <text x="460" y="638" class="annot" font-weight="700" fill="#c95a2a">how it preserves the prior</text>
    <text x="460" y="660" class="annot" fill="#5c5c66">the Agent can drift, but the</text>
    <text x="460" y="680" class="annot" fill="#5c5c66">rubber band pulls it back any</text>
    <text x="460" y="700" class="annot" fill="#5c5c66">time the policy diverges from</text>
    <text x="460" y="720" class="annot" fill="#5c5c66">the initial distribution.</text>
    <text x="460" y="758" class="annot" font-style="italic" fill="#5c5c66">trains the Agent without letting</text>
    <text x="460" y="778" class="annot" font-style="italic" fill="#5c5c66">it forget the pretrained shape.</text>
    <text x="460" y="816" class="key" fill="#c95a2a">protein fold preserved</text>
  </g>

  
  <g>
    <rect x="820" y="200" width="370" height="640" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="1.6"></rect>
    <circle cx="860" cy="240" r="22" fill="#b8902c"></circle>
    <text x="860" y="246" text-anchor="middle" class="card-num">3</text>
    <text x="892" y="234" class="card-tag" fill="#b8902c">QUANTIZATION</text>
    <text x="892" y="258" class="card-title">QLoRA frozen base</text>
    <text x="892" y="278" class="card-title">4-bit weights + LoRA</text>

    <g transform="translate(840,310)">
      <rect x="0" y="0" width="330" height="200" rx="10" fill="#fff7d9" stroke="#b8902c" stroke-width="1.4"></rect>
      <text x="165" y="32" text-anchor="middle" class="card-tag" fill="#7a5b13">FROZEN  ·  4-BIT</text>
      
      <g transform="translate(30,52)" opacity="0.7">
        <rect x="0" y="0" width="14" height="14" fill="#b8902c"></rect>
        <rect x="16" y="0" width="14" height="14" fill="#7a5b13"></rect>
        <rect x="32" y="0" width="14" height="14" fill="#b8902c"></rect>
        <rect x="48" y="0" width="14" height="14" fill="#7a5b13"></rect>
        <rect x="64" y="0" width="14" height="14" fill="#b8902c"></rect>
        <rect x="80" y="0" width="14" height="14" fill="#7a5b13"></rect>
        <rect x="0" y="16" width="14" height="14" fill="#7a5b13"></rect>
        <rect x="16" y="16" width="14" height="14" fill="#b8902c"></rect>
        <rect x="32" y="16" width="14" height="14" fill="#7a5b13"></rect>
        <rect x="48" y="16" width="14" height="14" fill="#b8902c"></rect>
        <rect x="64" y="16" width="14" height="14" fill="#7a5b13"></rect>
        <rect x="80" y="16" width="14" height="14" fill="#b8902c"></rect>
      </g>
      
      <rect x="100" y="120" width="60" height="22" rx="3" fill="#2c8a4f"></rect>
      <text x="130" y="136" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">A</text>
      <text x="166" y="136" class="mono">·</text>
      <rect x="180" y="120" width="60" height="22" rx="3" fill="#2c8a4f"></rect>
      <text x="210" y="136" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">B</text>
      <text x="165" y="174" text-anchor="middle" class="annot" fill="#5c5c66" font-style="italic">LoRA in FP16</text>
    </g>

    <text x="840" y="544" class="annot" font-weight="700">examples</text>
    <text x="840" y="566" class="annot">Geneformer-Scaling  ·  ESM-LoRA-4bit</text>
    <text x="840" y="586" class="annot">QLoRA on any open-weight LM</text>

    <line x1="840" y1="610" x2="1170" y2="610" stroke="#e1c66b" stroke-width="1"></line>
    <text x="840" y="638" class="annot" font-weight="700" fill="#b8902c">how it preserves the prior</text>
    <text x="840" y="660" class="annot" fill="#5c5c66">the quantization is lossy but</text>
    <text x="840" y="680" class="annot" fill="#5c5c66">tiny — and the LoRA matrices</text>
    <text x="840" y="700" class="annot" fill="#5c5c66">absorb whatever residual error</text>
    <text x="840" y="720" class="annot" fill="#5c5c66">the 4-bit base introduces.</text>
    <text x="840" y="758" class="annot" font-style="italic" fill="#5c5c66">embedding fidelity r = 0.998</text>
    <text x="840" y="778" class="annot" font-style="italic" fill="#5c5c66">at ~ 34 % of full-precision memory.</text>
    <text x="840" y="816" class="key" fill="#b8902c">consumer-GPU friendly</text>
  </g>

  
  <g>
    <rect x="1200" y="200" width="370" height="640" rx="14" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.6"></rect>
    <circle cx="1240" cy="240" r="22" fill="#4a6a8a"></circle>
    <text x="1240" y="246" text-anchor="middle" class="card-num">4</text>
    <text x="1272" y="234" class="card-tag" fill="#4a6a8a">INFERENCE-ONLY</text>
    <text x="1272" y="258" class="card-title">No gradient updates</text>
    <text x="1272" y="278" class="card-title">at all</text>

    <g transform="translate(1220,310)">
      
      <rect x="0" y="0" width="330" height="200" rx="10" fill="#ffffff" stroke="#4a6a8a" stroke-width="2" stroke-dasharray="6 4"></rect>
      <text x="165" y="32" text-anchor="middle" class="card-tag" fill="#4a6a8a">READ-ONLY  ❄</text>
      <text x="165" y="60" text-anchor="middle" class="card-title">Base LLM</text>
      <line x1="40" y1="80" x2="290" y2="80" stroke="#cfc5dd" stroke-width="1"></line>
      <text x="165" y="106" text-anchor="middle" class="annot" fill="#5c5c66">surrounded by agent loops, web</text>
      <text x="165" y="126" text-anchor="middle" class="annot" fill="#5c5c66">search, self-critique — but never</text>
      <text x="165" y="146" text-anchor="middle" class="annot" fill="#5c5c66">a backward pass.</text>
      
      <circle cx="36" cy="170" r="14" fill="#4a6a8a" opacity="0.7"></circle>
      <circle cx="80" cy="180" r="14" fill="#c95a2a" opacity="0.7"></circle>
      <circle cx="170" cy="180" r="14" fill="#6b4e8a" opacity="0.7"></circle>
      <circle cx="250" cy="180" r="14" fill="#b8902c" opacity="0.7"></circle>
      <circle cx="294" cy="170" r="14" fill="#2c8a4f" opacity="0.7"></circle>
    </g>

    <text x="1220" y="544" class="annot" font-weight="700">examples</text>
    <text x="1220" y="566" class="annot">GeneAgent  ·  CASSIA  ·  CyteType</text>
    <text x="1220" y="586" class="annot">AMIE  ·  SPARK orchestrator</text>

    <line x1="1220" y1="610" x2="1550" y2="610" stroke="#bcd2e6" stroke-width="1"></line>
    <text x="1220" y="638" class="annot" font-weight="700" fill="#4a6a8a">how it preserves the prior</text>
    <text x="1220" y="660" class="annot" fill="#5c5c66">there is nothing to forget —</text>
    <text x="1220" y="680" class="annot" fill="#5c5c66">the model is treated as a fixed</text>
    <text x="1220" y="700" class="annot" fill="#5c5c66">kernel inside a structured</text>
    <text x="1220" y="720" class="annot" fill="#5c5c66">workflow.</text>
    <text x="1220" y="758" class="annot" font-style="italic" fill="#5c5c66">the post-training is in the</text>
    <text x="1220" y="778" class="annot" font-style="italic" fill="#5c5c66">orchestration, not the weights.</text>
    <text x="1220" y="816" class="key" fill="#4a6a8a">architecture is the recipe</text>
  </g>

  
  <g>
    <rect x="1580" y="200" width="370" height="640" rx="14" fill="#ebe5f0" stroke="#6b4e8a" stroke-width="1.6"></rect>
    <circle cx="1620" cy="240" r="22" fill="#6b4e8a"></circle>
    <text x="1620" y="246" text-anchor="middle" class="card-num">5</text>
    <text x="1652" y="234" class="card-tag" fill="#6b4e8a">ACTIVE LEARNING</text>
    <text x="1652" y="258" class="card-title">Signature interpolation</text>
    <text x="1652" y="278" class="card-title">moving average targets</text>

    <g transform="translate(1600,330)">
      
      <rect x="0" y="0" width="120" height="40" rx="4" fill="#6b4e8a" opacity="0.5"></rect>
      <text x="60" y="24" text-anchor="middle" class="annot" fill="#1a1a22" font-weight="700">original target</text>

      <text x="135" y="26" class="mono" fill="#1a1a22">+  α ·</text>

      <rect x="190" y="0" width="120" height="40" rx="4" fill="#6b4e8a" opacity="0.85"></rect>
      <text x="250" y="24" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">experiment</text>

      <text x="135" y="80" class="mono" fill="#5c5c66">step-size α (tunable)</text>

      
      <rect x="60" y="110" width="200" height="40" rx="4" fill="#6b4e8a" opacity="0.7"></rect>
      <text x="160" y="134" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">refined signature</text>
    </g>

    <text x="1600" y="544" class="annot" font-weight="700">examples</text>
    <text x="1600" y="566" class="annot">DeMeo  ·  DrugReflector</text>
    <text x="1600" y="586" class="annot">any closed-loop active learner</text>

    <line x1="1600" y1="610" x2="1930" y2="610" stroke="#cfc5dd" stroke-width="1"></line>
    <text x="1600" y="638" class="annot" font-weight="700" fill="#6b4e8a">how it preserves the prior</text>
    <text x="1600" y="660" class="annot" fill="#5c5c66">α controls how fast the target</text>
    <text x="1600" y="680" class="annot" fill="#5c5c66">moves; setting α small keeps</text>
    <text x="1600" y="700" class="annot" fill="#5c5c66">the model anchored to its</text>
    <text x="1600" y="720" class="annot" fill="#5c5c66">original behaviour.</text>
    <text x="1600" y="758" class="annot" font-style="italic" fill="#5c5c66">drift is a dial, not an accident.</text>
    <text x="1600" y="816" class="key" fill="#6b4e8a">tunable update aggressiveness</text>
  </g>

  
  <g>
    <rect x="60" y="880" width="1880" height="200" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <text x="80" y="910" class="card-tag" fill="#7a5b13">THE WARNING</text>
    <text x="80" y="948" class="key" fill="#7a5b13">Every successful biological post-training paper has an explicit anti-forgetting mechanism.</text>
    <text x="80" y="982" class="annot">If yours doesn&#39;t, you&#39;re erasing the pretrained knowledge that made the model useful in the first place.</text>
    <text x="80" y="1010" class="annot">The failures aren&#39;t subtle — they show up as collapsed embeddings, forgotten rare classes, broken folds, or models that hallucinate confidently.</text>
    <text x="80" y="1046" class="annot" font-style="italic" fill="#5c5c66">Pick one of these five mechanisms before you start training. They are not optional.</text>
  </g>
</svg>