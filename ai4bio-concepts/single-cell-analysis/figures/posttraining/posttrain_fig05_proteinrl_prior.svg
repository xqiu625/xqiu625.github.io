<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c66"></path>
    </marker>
    <marker id="ar-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c95a2a"></path>
    </marker>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  PROTEINRL  ·  AGENT vs FROZEN PRIOR</text>
  <text x="60" y="96" class="h1">Two copies of the same model. One trains. One never moves.</text>
  <text x="60" y="124" class="h-sub">The frozen Prior is the anti-forgetting mechanism — same principle as freezing an scPEFT backbone, applied to RL.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
  <g>
    <rect x="60" y="200" width="540" height="280" rx="14" fill="#fbe6d8" stroke="#c95a2a" stroke-width="2"></rect>
    <text x="80" y="228" class="role-tag" fill="#c95a2a">AGENT PLM  ·  TRAINABLE  ▲</text>
    <text x="80" y="262" class="role-title">ProGen2-764M (trainable)</text>
    <text x="80" y="286" class="role-sub">generates candidate protein sequences; receives the policy-gradient update</text>

    
    <g transform="translate(80,310)">
      <rect x="0" y="0" width="480" height="140" rx="10" fill="#c95a2a" opacity="0.85" stroke="#a14854" stroke-width="1.6"></rect>
      <text x="240" y="36" text-anchor="middle" class="role-tag" fill="#ffffff">TRAINED  ▲</text>
      <text x="240" y="66" text-anchor="middle" class="role-title" fill="#ffffff">π_θ  =  P_Agent( sequence )</text>
      <text x="240" y="96" text-anchor="middle" class="annot" fill="#ffe7d6">gets gradient update every step</text>
      <text x="240" y="116" text-anchor="middle" class="annot" fill="#ffe7d6">moves toward higher reward</text>
    </g>
  </g>

  
  <g>
    <rect x="1400" y="200" width="540" height="280" rx="14" fill="#efeae0" stroke="#8a8275" stroke-width="2" stroke-dasharray="6 4"></rect>
    <text x="1420" y="228" class="role-tag" fill="#8a8275">PRIOR PLM  ·  FROZEN  ❄</text>
    <text x="1420" y="262" class="role-title">ProGen2-764M (frozen at init)</text>
    <text x="1420" y="286" class="role-sub">identical architecture — never updated, never receives gradient</text>

    <g transform="translate(1420,310)">
      <rect x="0" y="0" width="480" height="140" rx="10" fill="#efeae0" stroke="#8a8275" stroke-width="1.8" stroke-dasharray="4 3"></rect>
      <text x="240" y="36" text-anchor="middle" class="role-tag" fill="#8a8275">FROZEN  ❄</text>
      <text x="240" y="66" text-anchor="middle" class="role-title" fill="#1a1a22">π_ref  =  P_Prior( sequence )</text>
      <text x="240" y="96" text-anchor="middle" class="annot" fill="#5c5c66">snapshot of the model at t = 0</text>
      <text x="240" y="116" text-anchor="middle" class="annot" fill="#5c5c66">stays put for the entire RL run</text>
    </g>
  </g>

  
  <g>
    <text x="1000" y="240" text-anchor="middle" class="role-tag" fill="#6b4e8a">RUBBER-BAND REGULARIZATION</text>
    <text x="1000" y="270" text-anchor="middle" class="key" fill="#6b4e8a">KL-like penalty between Agent and Prior</text>

    
    <g transform="translate(610,360)">
      <path d="M 0 20&#xA;               L 30 0  L 60 40 L 90 0  L 120 40 L 150 0  L 180 40 L 210 0&#xA;               L 240 40 L 270 0  L 300 40 L 330 0  L 360 40 L 390 0  L 420 40&#xA;               L 450 0  L 480 40 L 510 0  L 540 40 L 570 0  L 600 40 L 630 0&#xA;               L 660 40 L 690 0  L 720 40 L 750 0  L 770 20" fill="none" stroke="#6b4e8a" stroke-width="2.5"></path>
    </g>
    <text x="1000" y="450" text-anchor="middle" class="formula">L_reg  =  [ log P_Agent − log P_Prior ]²</text>
    <text x="1000" y="476" text-anchor="middle" class="annot" font-style="italic" fill="#5c5c66">added to the policy gradient; pulls the Agent back when it drifts</text>
  </g>

  
  <line x1="330" y1="500" x2="330" y2="540" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>
  <text x="350" y="528" class="annot">sample candidate sequence</text>

  
  <g>
    <rect x="60" y="560" width="1880" height="200" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <text x="80" y="588" class="reward-tag">REWARDS  ·  THREE INDEPENDENT, COMPUTABLE FUNCTIONS</text>

    <g transform="translate(80,608)">
      <rect x="0" y="0" width="580" height="120" rx="10" fill="#ffffff" stroke="#b8902c" stroke-width="1.4"></rect>
      <text x="16" y="28" class="role-tag" fill="#b8902c">CHARGE</text>
      <text x="16" y="58" class="role-title">net_charge( seq )</text>
      <text x="16" y="86" class="annot">integer, computed from sequence in one pass</text>
      <text x="16" y="106" class="annot" fill="#5c5c66" font-style="italic">an exact, ungameable target</text>

      <rect x="612" y="0" width="580" height="120" rx="10" fill="#ffffff" stroke="#b8902c" stroke-width="1.4"></rect>
      <text x="628" y="28" class="role-tag" fill="#b8902c">FOLD QUALITY</text>
      <text x="628" y="58" class="role-title">pLDDT( ESMFold( seq ) )</text>
      <text x="628" y="86" class="annot">predicted local distance difference test</text>
      <text x="628" y="106" class="annot" fill="#5c5c66" font-style="italic">keeps designs foldable</text>

      <rect x="1224" y="0" width="580" height="120" rx="10" fill="#ffffff" stroke="#b8902c" stroke-width="1.4"></rect>
      <text x="1240" y="28" class="role-tag" fill="#b8902c">EXPRESSION PROBABILITY</text>
      <text x="1240" y="58" class="role-title">p_express( seq )</text>
      <text x="1240" y="86" class="annot">learned classifier on solubility / toxicity</text>
      <text x="1240" y="106" class="annot" fill="#5c5c66" font-style="italic">the only learned reward — capped, regularised</text>
    </g>
  </g>

  
  <line x1="1000" y1="770" x2="1000" y2="810" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>
  <text x="1020" y="794" class="annot">weighted geometric mean → scalar r</text>

  
  <g>
    <rect x="60" y="820" width="1880" height="120" rx="14" fill="#fbe6d8" stroke="#c95a2a" stroke-width="1.8"></rect>
    <text x="80" y="848" class="role-tag" fill="#c95a2a">POLICY UPDATE  ·  ANTI-FORGETTING BUILT IN</text>
    <text x="80" y="888" class="formula">L  =  −  r ( seq )   +   λ · L_reg ( π_θ ,  π_ref )</text>
    <text x="80" y="918" class="annot">first term pushes the Agent toward higher reward; second term keeps it close to the Prior. λ is the rubber-band stiffness.</text>
  </g>

  
  <g>
    <rect x="60" y="960" width="1880" height="120" rx="14" fill="#dfeede" stroke="#2c8a4f" stroke-width="2"></rect>
    <text x="80" y="988" class="role-tag" fill="#2c8a4f">RESULT</text>
    <text x="80" y="1020" class="key" fill="#2c8a4f">Extreme target properties achieved while active-site residues and fold are preserved.</text>
    <text x="80" y="1046" class="annot">net charge reaches  + 18  and  − 39  on demand; fold pLDDT &gt; 0.75; conserved residues at active sites untouched.</text>
    <text x="80" y="1068" class="annot" font-style="italic" fill="#5c5c66">the Prior is the anti-forgetting mechanism — same principle as scPEFT freezing the backbone, applied to RL.</text>
  </g>
</svg>