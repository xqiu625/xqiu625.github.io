<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  EVIDENCE HIERARCHY FOR CAUSAL CLAIMS IN SINGLE CELL</text>
  <text x="60" y="96" class="h1">Five rungs from &#34;co-expressed&#34; to &#34;intervened and measured&#34;.</text>
  <text x="60" y="124" class="h-sub">Most published GRN edges live in the bottom two rungs. Moving claims up this ladder is what causal inference is for.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
  
  <g>
    
    <polygon points="800,200 1200,200 1140,290 860,290" fill="#2c8a4f" stroke="#1a1a22" stroke-width="1.5"></polygon>
    <text x="1000" y="252" text-anchor="middle" class="level-title" fill="#ffffff">LEVEL 5  ✅</text>
    <text x="1000" y="276" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">real interventional data</text>

    
    <polygon points="740,290 1260,290 1200,380 800,380" fill="#4a6a8a" stroke="#1a1a22" stroke-width="1.5"></polygon>
    <text x="1000" y="342" text-anchor="middle" class="level-title" fill="#ffffff">LEVEL 4</text>
    <text x="1000" y="366" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">genetics-anchored MR</text>

    
    <polygon points="680,380 1320,380 1260,470 740,470" fill="#b8902c" stroke="#1a1a22" stroke-width="1.5"></polygon>
    <text x="1000" y="432" text-anchor="middle" class="level-title" fill="#ffffff">LEVEL 3</text>
    <text x="1000" y="456" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">virtual / in-silico KO</text>

    
    <polygon points="620,470 1380,470 1320,560 680,560" fill="#c95a2a" stroke="#1a1a22" stroke-width="1.5"></polygon>
    <text x="1000" y="522" text-anchor="middle" class="level-title" fill="#ffffff">LEVEL 2</text>
    <text x="1000" y="546" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">observational GRN inference</text>

    
    <polygon points="560,560 1440,560 1380,650 620,650" fill="#a14854" stroke="#1a1a22" stroke-width="1.5"></polygon>
    <text x="1000" y="612" text-anchor="middle" class="level-title" fill="#ffffff">LEVEL 1  ⚠</text>
    <text x="1000" y="636" text-anchor="middle" class="annot" fill="#ffffff" font-weight="700">co-expression correlation</text>

    
    <rect x="500" y="650" width="1000" height="40" fill="#5c5c66"></rect>
    <text x="1000" y="676" text-anchor="middle" class="level-tag" fill="#ffffff">DATA  ·  scRNA-seq + Perturb-seq + genetics</text>

    
    <text x="430" y="660" text-anchor="end" class="annot" font-style="italic" fill="#5c5c66">weakest  ↓</text>
    <text x="430" y="240" text-anchor="end" class="annot" font-style="italic" fill="#5c5c66">strongest  ↑</text>
    <line x1="380" y1="650" x2="380" y2="270" stroke="#5c5c66" stroke-width="2.5"></line>
    <polygon points="380,250 372,270 388,270" fill="#5c5c66"></polygon>
  </g>

  
  <g>
    
    <rect x="1480" y="690" width="460" height="80" rx="10" fill="#fbe6e6" stroke="#a14854" stroke-width="1.4"></rect>
    <text x="1500" y="716" class="level-tag" fill="#a14854">LEVEL 1  ·  CO-EXPRESSION  📈</text>
    <text x="1500" y="740" class="annot">Gene A and Gene B are co-expressed.</text>
    <text x="1500" y="760" class="annot" font-style="italic" fill="#5c5c66">no directionality, no mechanism.</text>

    
    <rect x="1480" y="600" width="460" height="80" rx="10" fill="#fbe6d8" stroke="#c95a2a" stroke-width="1.4"></rect>
    <text x="1500" y="626" class="level-tag" fill="#c95a2a">LEVEL 2  ·  OBSERVATIONAL GRN  📜</text>
    <text x="1500" y="650" class="annot">NOTEARS et al. infer a directed edge from observations.</text>
    <text x="1500" y="670" class="annot" font-style="italic" fill="#5c5c66">unobserved confounders may still explain it.</text>

    
    <rect x="1480" y="510" width="460" height="80" rx="10" fill="#fff7d9" stroke="#b8902c" stroke-width="1.4"></rect>
    <text x="1500" y="536" class="level-tag" fill="#7a5b13">LEVEL 3  ·  VIRTUAL KO  💻</text>
    <text x="1500" y="560" class="annot">scTenifoldKnk  ·  Geneformer in-silico KO from WT data.</text>
    <text x="1500" y="580" class="annot" font-style="italic" fill="#5c5c66">suggestive  ·  not validated.</text>

    
    <rect x="1480" y="420" width="460" height="80" rx="10" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.4"></rect>
    <text x="1500" y="446" class="level-tag" fill="#4a6a8a">LEVEL 4  ·  GENETICS-ANCHORED MR  🧬</text>
    <text x="1500" y="470" class="annot">Airqtl uses SNPs as instruments  ·  directional, orthogonal.</text>
    <text x="1500" y="490" class="annot" font-style="italic" fill="#5c5c66">strong, but assumes instrument validity.</text>

    
    <rect x="1480" y="330" width="460" height="80" rx="10" fill="#dfeede" stroke="#2c8a4f" stroke-width="1.4"></rect>
    <text x="1500" y="356" class="level-tag" fill="#2c8a4f">LEVEL 5  ·  INTERVENTIONAL  ✂</text>
    <text x="1500" y="380" class="annot">Perturb-seq  ·  CRISPRi/a  ·  CausalBench.</text>
    <text x="1500" y="400" class="annot" font-style="italic" fill="#5c5c66">actual perturbation + measured outcome  =  ground truth.</text>
  </g>

  
  <g>
    <text x="80" y="200" class="level-tag" fill="#8a5a4a">SAMPLE CLAIM AT EACH LEVEL  ·  SAME TWO GENES, DIFFERENT STRENGTH</text>

    <rect x="60" y="220" width="280" height="80" rx="10" fill="#dfeede" stroke="#2c8a4f" stroke-width="1.4"></rect>
    <text x="80" y="246" class="level-tag" fill="#2c8a4f">LEVEL 5  ✂</text>
    <text x="80" y="268" class="annot">&#34;knocking out A drops B&#34;</text>
    <text x="80" y="288" class="annot" fill="#5c5c66">measured in Perturb-seq</text>

    <rect x="60" y="320" width="280" height="80" rx="10" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.4"></rect>
    <text x="80" y="346" class="level-tag" fill="#4a6a8a">LEVEL 4  🧬</text>
    <text x="80" y="368" class="annot">&#34;SNP affecting A also moves B&#34;</text>
    <text x="80" y="388" class="annot" fill="#5c5c66">cis-eQTL → MR triangle</text>

    <rect x="60" y="420" width="280" height="80" rx="10" fill="#fff7d9" stroke="#b8902c" stroke-width="1.4"></rect>
    <text x="80" y="446" class="level-tag" fill="#7a5b13">LEVEL 3  💻</text>
    <text x="80" y="468" class="annot">&#34;simulated A-KO depletes B&#34;</text>
    <text x="80" y="488" class="annot" fill="#5c5c66">virtual KO  →  predicted effect</text>

    <rect x="60" y="520" width="280" height="80" rx="10" fill="#fbe6d8" stroke="#c95a2a" stroke-width="1.4"></rect>
    <text x="80" y="546" class="level-tag" fill="#c95a2a">LEVEL 2  📜</text>
    <text x="80" y="568" class="annot">&#34;DAG says A → B&#34;</text>
    <text x="80" y="588" class="annot" fill="#5c5c66">observational GRN edge</text>

    <rect x="60" y="620" width="280" height="80" rx="10" fill="#fbe6e6" stroke="#a14854" stroke-width="1.4"></rect>
    <text x="80" y="646" class="level-tag" fill="#a14854">LEVEL 1  📈</text>
    <text x="80" y="668" class="annot">&#34;A and B are correlated&#34;</text>
    <text x="80" y="688" class="annot" fill="#5c5c66">no direction at all</text>
  </g>

  
  <g>
    <rect x="60" y="820" width="1880" height="240" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <text x="80" y="850" class="level-tag" fill="#7a5b13">HOW TO READ THIS</text>
    <text x="80" y="888" class="key" fill="#7a5b13">most published GRN edges live at Level 1 – 2.  causal inference is the ladder that moves them up.</text>

    <text x="80" y="930" class="annot" font-weight="700">good citation</text>
    <text x="240" y="930" class="annot">&#34;A → B at Level 4 (Airqtl MR, p &lt; 1e-5) and Level 5 (CRISPRi KO, log-FC = -1.2)&#34;</text>
    <text x="80" y="958" class="annot" font-weight="700">unsupported claim</text>
    <text x="240" y="958" class="annot">&#34;the GRN shows A regulates B&#34;  (Level 2 only, no validation)</text>

    <text x="80" y="998" class="annot" font-style="italic" fill="#5c5c66">two independent rungs agreeing  →  robust.  one rung alone, especially Level 1 – 2  →  hypothesis-only.</text>
    <text x="80" y="1024" class="annot" font-style="italic" fill="#5c5c66">treat causal claims like clinical evidence: report the level, not just the verdict.</text>
    <text x="80" y="1056" class="key" fill="#a14854">⚠  refusing to climb the ladder is how field-wide false-positive cascades start.</text>
  </g>
</svg>