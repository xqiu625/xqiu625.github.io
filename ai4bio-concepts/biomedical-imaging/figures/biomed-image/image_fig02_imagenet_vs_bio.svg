<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  IMAGENET vs BIOMEDICAL IMAGES  ·  THREE AXES OF DIFFICULTY</text>
  <text x="60" y="96" class="h1">Different size, different noise, different labels.</text>
  <text x="60" y="124" class="h-sub">General-purpose vision models fail on biology without domain adaptation — and these are the reasons why.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  

  
  <g>
    <rect x="60" y="180" width="610" height="780" rx="14" fill="#ffffff" stroke="#4a6a8a" stroke-width="1.8"></rect>
    <text x="80" y="208" class="panel-tag" fill="#4a6a8a">PANEL 1  ·  RESOLUTION  📏</text>
    <text x="80" y="244" class="panel-title">pixels per image</text>

    
    <g transform="translate(80,280)">
      <rect x="0" y="0" width="540" height="200" rx="10" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.2"></rect>
      <text x="20" y="30" class="side-tag" fill="#4a6a8a">IMAGENET  🐱</text>
      <text x="20" y="64" class="stat" fill="#4a6a8a">224 × 224 px</text>
      <text x="20" y="92" class="annot">one image, one subject (a cat, a dog)</text>
      
      <rect x="380" y="40" width="140" height="140" fill="#4a6a8a" opacity="0.20" stroke="#4a6a8a"></rect>
      <text x="450" y="118" text-anchor="middle" class="emoji">🐱</text>
    </g>

    
    <g transform="translate(80,500)">
      <rect x="0" y="0" width="540" height="280" rx="10" fill="#fbe6e6" stroke="#a14854" stroke-width="1.4"></rect>
      <text x="20" y="30" class="side-tag" fill="#a14854">WHOLE-SLIDE H&amp;E  🧫</text>
      <text x="20" y="64" class="stat" fill="#a14854">~ 100 000 × 100 000 px</text>
      <text x="20" y="92" class="annot">50 000+ cells per slide</text>
      
      <g transform="translate(280,40)">
        <rect x="0" y="0" width="240" height="220" fill="#fbe6e6" stroke="#a14854"></rect>
        <g stroke="#a14854" stroke-width="0.4" opacity="0.5">
          <line x1="20" y1="0" x2="20" y2="220"></line>
          <line x1="40" y1="0" x2="40" y2="220"></line>
          <line x1="60" y1="0" x2="60" y2="220"></line>
          <line x1="80" y1="0" x2="80" y2="220"></line>
          <line x1="100" y1="0" x2="100" y2="220"></line>
          <line x1="120" y1="0" x2="120" y2="220"></line>
          <line x1="140" y1="0" x2="140" y2="220"></line>
          <line x1="160" y1="0" x2="160" y2="220"></line>
          <line x1="180" y1="0" x2="180" y2="220"></line>
          <line x1="200" y1="0" x2="200" y2="220"></line>
          <line x1="220" y1="0" x2="220" y2="220"></line>
          <line x1="0" y1="20" x2="240" y2="20"></line>
          <line x1="0" y1="40" x2="240" y2="40"></line>
          <line x1="0" y1="60" x2="240" y2="60"></line>
          <line x1="0" y1="80" x2="240" y2="80"></line>
          <line x1="0" y1="100" x2="240" y2="100"></line>
          <line x1="0" y1="120" x2="240" y2="120"></line>
          <line x1="0" y1="140" x2="240" y2="140"></line>
          <line x1="0" y1="160" x2="240" y2="160"></line>
          <line x1="0" y1="180" x2="240" y2="180"></line>
          <line x1="0" y1="200" x2="240" y2="200"></line>
        </g>
        <rect x="100" y="100" width="20" height="20" fill="#a14854"></rect>
        <text x="170" y="116" class="annot" fill="#a14854" font-weight="700">one patch  =  ImageNet</text>
      </g>
      <text x="20" y="252" class="key" fill="#a14854">~ 200 000×  more pixels</text>
    </g>

    <text x="80" y="910" class="annot" font-style="italic" fill="#5c5c66">processed in patches  →  locality bias  →  can&#39;t see the whole tumour at once.</text>
  </g>

  
  <g>
    <rect x="690" y="180" width="610" height="780" rx="14" fill="#ffffff" stroke="#c95a2a" stroke-width="1.8"></rect>
    <text x="710" y="208" class="panel-tag" fill="#c95a2a">PANEL 2  ·  BATCH EFFECTS  🎨</text>
    <text x="710" y="244" class="panel-title">technical variation swamps biology</text>

    
    <g transform="translate(710,280)">
      <rect x="0" y="0" width="540" height="200" rx="10" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.2"></rect>
      <text x="20" y="30" class="side-tag" fill="#4a6a8a">IMAGENET  🌈</text>
      <text x="20" y="60" class="annot">photos vary by content  ·  cat vs dog vs car</text>
      <text x="20" y="80" class="annot">noise is roughly random</text>
      <g transform="translate(20,100)">
        <text x="0" y="0" class="emoji">🐱</text>
        <text x="60" y="0" class="emoji">🐶</text>
        <text x="120" y="0" class="emoji">🐦</text>
        <text x="180" y="0" class="emoji">🐠</text>
        <text x="240" y="0" class="emoji">🚗</text>
      </g>
      <text x="20" y="180" class="annot" font-style="italic" fill="#5c5c66">labels and noise are independent.</text>
    </g>

    
    <g transform="translate(710,500)">
      <rect x="0" y="0" width="540" height="280" rx="10" fill="#fbe6d8" stroke="#c95a2a" stroke-width="1.4"></rect>
      <text x="20" y="30" class="side-tag" fill="#c95a2a">TWO IDENTICAL TISSUES, TWO LABS  🔬</text>
      <text x="20" y="58" class="annot">same biology  ·  different colour, contrast, intensity</text>

      <g transform="translate(20,80)">
        <rect x="0" y="0" width="120" height="120" rx="6" fill="#ffe7d6" stroke="#c95a2a"></rect>
        <circle cx="40" cy="40" r="10" fill="#a14854" opacity="0.7"></circle>
        <circle cx="80" cy="60" r="10" fill="#a14854" opacity="0.7"></circle>
        <circle cx="60" cy="90" r="10" fill="#6b4e8a" opacity="0.7"></circle>
        <text x="60" y="160" text-anchor="middle" class="annot">Lab A</text>

        <rect x="140" y="0" width="120" height="120" rx="6" fill="#dfeede" stroke="#2c8a4f"></rect>
        <circle cx="180" cy="40" r="10" fill="#2c8a4f" opacity="0.7"></circle>
        <circle cx="220" cy="60" r="10" fill="#2c8a4f" opacity="0.7"></circle>
        <circle cx="200" cy="90" r="10" fill="#4a6a8a" opacity="0.7"></circle>
        <text x="200" y="160" text-anchor="middle" class="annot">Lab B</text>

        <text x="284" y="78" class="emoji">⚠</text>
        <text x="320" y="78" class="annot" font-weight="700" fill="#a14854">looks like different tissue</text>
      </g>
    </g>

    <text x="710" y="910" class="annot" font-style="italic" fill="#5c5c66">cell painting: controls cluster by plate position, not by gene KO. Batch &gt; biology.</text>
  </g>

  
  <g>
    <rect x="1320" y="180" width="620" height="780" rx="14" fill="#ffffff" stroke="#b8902c" stroke-width="1.8"></rect>
    <text x="1340" y="208" class="panel-tag" fill="#7a5b13">PANEL 3  ·  LABEL SCARCITY  🏷</text>
    <text x="1340" y="244" class="panel-title">how many labels can you actually get?</text>

    <g transform="translate(1340,280)">
      <rect x="0" y="0" width="560" height="200" rx="10" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.2"></rect>
      <text x="20" y="30" class="side-tag" fill="#4a6a8a">IMAGENET</text>
      <text x="20" y="64" class="stat" fill="#4a6a8a">~ 14 M  image-level labels</text>
      <text x="20" y="92" class="annot">crowd-sourced, cheap, high throughput</text>
      <g transform="translate(380,80)">
        <text x="0" y="0" class="emoji">🏷</text>
        <text x="40" y="0" class="emoji">🏷</text>
        <text x="80" y="0" class="emoji">🏷</text>
      </g>
      <text x="20" y="180" class="annot" font-style="italic" fill="#5c5c66">labels are the easy part.</text>
    </g>

    <g transform="translate(1340,500)">
      <rect x="0" y="0" width="560" height="280" rx="10" fill="#fbe6e6" stroke="#a14854" stroke-width="1.4"></rect>
      <text x="20" y="30" class="side-tag" fill="#a14854">WSI  ·  ONE PATIENT-LEVEL LABEL</text>
      <text x="20" y="64" class="stat" fill="#a14854">1 label per 100 K × 100 K image</text>
      <text x="20" y="92" class="annot">pixel-level masks cost weeks of expert annotation</text>

      <line x1="20" y1="116" x2="540" y2="116" stroke="#e1c66b" stroke-width="1"></line>

      <text x="20" y="144" class="annot" font-weight="700">case study  ·  Cellpose 🐠</text>
      <text x="20" y="166" class="annot">70 000+ community annotations  ·  years of effort</text>

      <text x="20" y="206" class="annot" font-weight="700">weakly supervised  ·  PaSCient 🧑‍🔬</text>
      <text x="20" y="228" class="annot">multi-instance learning to bridge the gap</text>

      <text x="20" y="262" class="annot" font-style="italic" fill="#a14854">expert time is the bottleneck, not data acquisition.</text>
    </g>

    <text x="1340" y="910" class="annot" font-style="italic" fill="#5c5c66">supervision must come from somewhere else  —  self-supervision, weak labels, or expert collaboration.</text>
  </g>

  
  <g>
    <rect x="60" y="980" width="1880" height="90" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <text x="80" y="1010" class="panel-tag" fill="#7a5b13">THE BOTTOM LINE</text>
    <text x="80" y="1044" class="key" fill="#7a5b13">these three problems are why general-purpose vision models fail on biology without domain adaptation.</text>
    <text x="80" y="1066" class="annot" font-style="italic" fill="#5c5c66">if you skip resolution / batch-effect / label-scarcity considerations, your H&amp;E model will recognise stains, not disease.</text>
  </g>
</svg>