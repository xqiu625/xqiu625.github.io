<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c66"></path>
    </marker>
    <marker id="ar-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c8a4f"></path>
    </marker>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  IN-SILICO PERTURBATION PIPELINE</text>
  <text x="60" y="96" class="h1">Virtual gene knockout, end to end.</text>
  <text x="60" y="124" class="h-sub">From pretrained foundation model to ranked drug-target shortlist — one shared pipeline, two ways to reach it.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  

  
  <g>
    <rect x="60" y="380" width="280" height="200" rx="14" fill="#e3edf6" stroke="#4a6a8a" stroke-width="2"></rect>
    <circle cx="100" cy="418" r="20" fill="#4a6a8a"></circle>
    <text x="100" y="425" text-anchor="middle" class="stage-num">1</text>
    <text x="130" y="412" class="stage-tag">STAGE 01</text>
    <text x="130" y="434" class="stage-title">Pretrained Geneformer</text>
    <line x1="80" y1="450" x2="320" y2="450" stroke="#bcd2e6" stroke-width="1"></line>
    <text x="80" y="476" class="annot">30M+ cell corpus</text>
    <text x="80" y="496" class="annot">rank-value tokens, MLM</text>
    <text x="80" y="516" class="annot">12-layer BERT</text>
    <text x="80" y="546" class="stage-sub" font-style="italic">general-purpose checkpoint</text>
    <text x="80" y="564" class="stage-sub" font-style="italic">shared by both paths below</text>
  </g>

  
  <line x1="345" y1="480" x2="385" y2="480" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <g>
    <rect x="390" y="380" width="280" height="200" rx="14" fill="#fbe6d8" stroke="#c95a2a" stroke-width="2"></rect>
    <circle cx="430" cy="418" r="20" fill="#c95a2a"></circle>
    <text x="430" y="425" text-anchor="middle" class="stage-num">2</text>
    <text x="460" y="412" class="stage-tag" fill="#c95a2a">STAGE 02</text>
    <text x="460" y="434" class="stage-title">Fine-tune on disease atlas</text>
    <line x1="410" y1="450" x2="650" y2="450" stroke="#e7c5a8" stroke-width="1"></line>
    <text x="410" y="476" class="annot">e.g. cardiac iPSC-CMs</text>
    <text x="410" y="496" class="annot">tissue-specific labels</text>
    <text x="410" y="516" class="annot">add MLP head, ~3-5 epochs</text>
    <text x="410" y="546" class="stage-sub" font-style="italic">QLoRA 4-bit  ·  hours of GPU</text>
    <text x="410" y="564" class="cost-tag">~ $5 000 compute</text>
  </g>

  <line x1="675" y1="480" x2="715" y2="480" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <g>
    <rect x="720" y="380" width="320" height="200" rx="14" fill="#ebe5f0" stroke="#6b4e8a" stroke-width="2"></rect>
    <circle cx="760" cy="418" r="20" fill="#6b4e8a"></circle>
    <text x="760" y="425" text-anchor="middle" class="stage-num">3</text>
    <text x="790" y="412" class="stage-tag" fill="#6b4e8a">STAGE 03</text>
    <text x="790" y="434" class="stage-title">In-silico KO</text>
    <line x1="740" y1="450" x2="1020" y2="450" stroke="#cfc5dd" stroke-width="1"></line>

    <text x="740" y="476" class="annot">delete one gene token from input</text>

    
    <g transform="translate(740,490)">
      <rect x="0" y="0" width="44" height="22" rx="3" fill="#7d97b6"></rect>
      <text x="22" y="16" text-anchor="middle" class="mono-sm" fill="#ffffff">CD3E</text>
      <rect x="48" y="0" width="44" height="22" rx="3" fill="#7d97b6"></rect>
      <text x="70" y="16" text-anchor="middle" class="mono-sm" fill="#ffffff">ACTB</text>
      <rect x="96" y="0" width="56" height="22" rx="3" fill="#fbe6e6" stroke="#a14854" stroke-width="2"></rect>
      <text x="124" y="16" text-anchor="middle" class="mono-sm" fill="#a14854" font-weight="700">GATA4</text>
      <line x1="96" y1="0" x2="152" y2="22" stroke="#a14854" stroke-width="2"></line>
      <line x1="96" y1="22" x2="152" y2="0" stroke="#a14854" stroke-width="2"></line>
      <rect x="156" y="0" width="50" height="22" rx="3" fill="#7d97b6"></rect>
      <text x="181" y="16" text-anchor="middle" class="mono-sm" fill="#ffffff">FOXP3</text>
      <text x="212" y="16" class="mono-sm">…</text>
    </g>

    <text x="740" y="546" class="stage-sub">repeat for every candidate gene</text>
    <text x="740" y="564" class="stage-sub" font-style="italic">4 096 genes × 30k cells</text>
  </g>

  <line x1="1045" y1="480" x2="1085" y2="480" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <g>
    <rect x="1090" y="380" width="320" height="200" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <circle cx="1130" cy="418" r="20" fill="#b8902c"></circle>
    <text x="1130" y="425" text-anchor="middle" class="stage-num">4</text>
    <text x="1160" y="412" class="stage-tag" fill="#b8902c">STAGE 04</text>
    <text x="1160" y="434" class="stage-title">Compare embeddings</text>
    <line x1="1110" y1="450" x2="1390" y2="450" stroke="#e1c66b" stroke-width="1"></line>

    
    <g transform="translate(1110,470)">
      <text x="0" y="0" class="mono-sm" fill="#5c5c66">z (original)</text>
      <g transform="translate(0,4)">
        <rect x="0" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.85"></rect>
        <rect x="12" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.4"></rect>
        <rect x="24" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.7"></rect>
        <rect x="36" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.3"></rect>
        <rect x="48" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.6"></rect>
        <rect x="60" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.5"></rect>
        <rect x="72" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.75"></rect>
        <rect x="84" y="0" width="10" height="14" fill="#4a6a8a" opacity="0.5"></rect>
      </g>
      <text x="0" y="40" class="mono-sm" fill="#5c5c66">z′ (GATA4 knocked out)</text>
      <g transform="translate(0,44)">
        <rect x="0" y="0" width="10" height="14" fill="#c95a2a" opacity="0.85"></rect>
        <rect x="12" y="0" width="10" height="14" fill="#c95a2a" opacity="0.42"></rect>
        <rect x="24" y="0" width="10" height="14" fill="#c95a2a" opacity="0.30"></rect>
        <rect x="36" y="0" width="10" height="14" fill="#c95a2a" opacity="0.62"></rect>
        <rect x="48" y="0" width="10" height="14" fill="#c95a2a" opacity="0.30"></rect>
        <rect x="60" y="0" width="10" height="14" fill="#c95a2a" opacity="0.65"></rect>
        <rect x="72" y="0" width="10" height="14" fill="#c95a2a" opacity="0.42"></rect>
        <rect x="84" y="0" width="10" height="14" fill="#c95a2a" opacity="0.78"></rect>
      </g>
    </g>

    <text x="1110" y="554" class="annot" font-weight="700">cos(z, z′)  =  0.62</text>
    <text x="1110" y="572" class="stage-sub">large shift  →  gene matters in this tissue</text>
  </g>

  <line x1="1415" y1="480" x2="1455" y2="480" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <g>
    <rect x="1460" y="380" width="480" height="200" rx="14" fill="#dfeede" stroke="#2c8a4f" stroke-width="2"></rect>
    <circle cx="1500" cy="418" r="20" fill="#2c8a4f"></circle>
    <text x="1500" y="425" text-anchor="middle" class="stage-num">5</text>
    <text x="1530" y="412" class="stage-tag" fill="#2c8a4f">STAGE 05</text>
    <text x="1530" y="434" class="stage-title">Rank genes by perturbation effect</text>
    <line x1="1480" y1="450" x2="1920" y2="450" stroke="#bcd6bc" stroke-width="1"></line>

    
    <g transform="translate(1480,464)">
      <text x="0" y="10" class="mono-sm" fill="#2c8a4f" font-weight="700">GATA4</text>
      <rect x="76" y="0" width="280" height="14" fill="#2c8a4f"></rect>
      <text x="362" y="10" class="mono-sm" font-weight="700">0.38</text>

      <text x="0" y="28" class="mono-sm" fill="#2c8a4f" font-weight="700">NKX2-5</text>
      <rect x="76" y="18" width="240" height="14" fill="#2c8a4f" opacity="0.85"></rect>
      <text x="322" y="28" class="mono-sm" font-weight="700">0.31</text>

      <text x="0" y="46" class="mono-sm" fill="#2c8a4f" font-weight="700">TBX5</text>
      <rect x="76" y="36" width="200" height="14" fill="#2c8a4f" opacity="0.75"></rect>
      <text x="282" y="46" class="mono-sm" font-weight="700">0.26</text>

      <text x="0" y="64" class="mono-sm">MEF2C</text>
      <rect x="76" y="54" width="160" height="14" fill="#2c8a4f" opacity="0.55"></rect>
      <text x="242" y="64" class="mono-sm">0.21</text>

      <text x="0" y="82" class="mono-sm">…</text>
      <text x="76" y="82" class="mono-sm" fill="#5c5c66" font-style="italic">~ 4 086 more</text>
    </g>

    <text x="1480" y="572" class="stage-sub" font-style="italic">top-ranked genes  →  candidate drug targets</text>
  </g>

  
  <g>
    <rect x="390" y="640" width="1020" height="80" rx="12" fill="#fff7d9" stroke="#b8902c" stroke-width="1.5"></rect>
    <text x="410" y="668" class="cost-tag">COMPUTE COST FOR THE FINE-TUNE PATH</text>
    <text x="410" y="694" class="annot"><tspan font-weight="700">4 096 genes  ×  30 000 cells</tspan>  ·  ~  $5 K compute  ·  ~  5.9 days on a single A100 node  ·  uses 4-bit QLoRA</text>
    <text x="410" y="712" class="annot" font-style="italic" fill="#5c5c66">Most of the cost is the per-gene re-evaluation loop, not the original fine-tune.</text>
  </g>

  

  
  <path d="M 200 580 L 200 800 L 720 800" fill="none" stroke="#2c8a4f" stroke-width="2.5" marker-end="url(#ar-alt)" stroke-dasharray="0"></path>
  <text x="220" y="700" class="stage-tag" fill="#2c8a4f">ALTERNATIVE PATH  ·  NO FINE-TUNE</text>

  
  <g>
    <rect x="730" y="760" width="680" height="170" rx="14" fill="#ffffff" stroke="#2c8a4f" stroke-width="2"></rect>
    <circle cx="770" cy="798" r="20" fill="#2c8a4f"></circle>
    <text x="770" y="806" text-anchor="middle" class="stage-num">★</text>
    <text x="800" y="792" class="stage-tag" fill="#2c8a4f">ALTERNATIVE  ·  STACK + IN-CONTEXT LEARNING</text>
    <text x="800" y="816" class="stage-title">Provide labeled prompt cells directly</text>
    <line x1="750" y1="830" x2="1390" y2="830" stroke="#bcd6bc" stroke-width="1"></line>
    <text x="750" y="854" class="annot">•  no gradient updates on disease atlas</text>
    <text x="750" y="874" class="annot">•  ~ 100 labeled reference cells live in the prompt</text>
    <text x="750" y="894" class="annot">•  same Stage-3 KO loop on top, but no fine-tune budget</text>
    <text x="750" y="918" class="cost-tag" fill="#2c8a4f">→  same target ranking, hours instead of days</text>
  </g>

  
  <path d="M 1410 845 L 1450 845 L 1450 580 L 880 580" fill="none" stroke="#2c8a4f" stroke-width="2.5" marker-end="url(#ar-alt)" stroke-dasharray="5 4"></path>
  <text x="1240" y="595" class="stage-sub" font-style="italic" fill="#2c8a4f">re-joins the KO loop at Stage 3</text>

  
  <g>
    <rect x="60" y="970" width="1880" height="100" rx="12" fill="#ffffff" stroke="#d8d5cb" stroke-width="1"></rect>
    <text x="80" y="998" class="stage-tag" fill="#8a5a4a">PIPELINE SUMMARY</text>
    <text x="80" y="1028" class="annot">Stages 1 → 5 produce a ranked list of candidate drug targets. The fine-tune path (orange) and the STACK / ICL path (green) share Stages 1, 3, 4, and 5; the ICL path skips Stage 2.</text>
    <text x="80" y="1054" class="annot" font-style="italic" fill="#5c5c66">Pick the fine-tune route when you have a sizable labeled atlas; pick the ICL route when you have ~100 well-labeled reference cells and want a same-day answer.</text>
  </g>
</svg>