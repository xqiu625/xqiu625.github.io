    <line x1="16" y1="282" x2="584" y2="282" stroke="#e5dfcf" stroke-width="1"></line>
    <text x="16" y="306" class="annot" font-weight="700">Homologous genes get near-identical vectors automatically.</text>
    <text x="16" y="326" class="annot" font-style="italic" fill="#5c5c66">No homolog table is consulted — the alignment lives in the</text>
    <text x="16" y="344" class="annot" font-style="italic" fill="#5c5c66">protein-sequence model.</text>
  </g>

  
  <line x1="1290" y1="540" x2="1335" y2="540" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <text x="1360" y="200" class="col-eyebrow" fill="#2c8a4f">RIGHT  ·  OUTPUT</text>
  <text x="1360" y="226" class="col-title">A shared cell embedding space</text>
  <text x="1360" y="246" class="col-sub">unordered set in, one vector out — species-agnostic</text>

  
  <g>
    <rect x="1360" y="290" width="560" height="160" rx="14" fill="#dfeede" stroke="#2c8a4f" stroke-width="2"></rect>
    <text x="1640" y="318" text-anchor="middle" class="col-eyebrow" fill="#2c8a4f">CELL TRANSFORMER ENCODER</text>
    <text x="1640" y="350" text-anchor="middle" class="col-title">attention over the bag of gene-embedding tokens</text>
    <text x="1640" y="378" text-anchor="middle" class="col-sub">no positional encoding  ·  permutation-invariant</text>
    <text x="1640" y="402" text-anchor="middle" class="col-sub">outputs one fixed-dim embedding per cell</text>
    <text x="1640" y="430" text-anchor="middle" class="mono">z_cell  ∈  ℝ¹²⁸⁰</text>
  </g>

  
  <g>
    <rect x="1360" y="470" width="560" height="380" rx="14" fill="#ffffff" stroke="#2c8a4f" stroke-width="1.4"></rect>
    <text x="1378" y="496" class="col-eyebrow" fill="#2c8a4f">CELL EMBEDDING SPACE  (2-D PROJECTION)</text>

    
    <line x1="1390" y1="820" x2="1900" y2="820" stroke="#2a2a33" stroke-width="1.2"></line>
    <line x1="1390" y1="820" x2="1390" y2="510" stroke="#2a2a33" stroke-width="1.2"></line>
    <text x="1900" y="838" text-anchor="end" class="mono-sm">UMAP-1</text>
    <text x="0" y="0" transform="translate(1380,510) rotate(-90)" text-anchor="end" class="mono-sm">UMAP-2</text>

    
    <g>
