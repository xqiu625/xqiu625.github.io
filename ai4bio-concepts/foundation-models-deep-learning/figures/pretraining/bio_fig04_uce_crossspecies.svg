      <text x="0" y="84" text-anchor="middle" class="col-sub">cell.X (Mm)</text>
    </g>

    <text x="240" y="646" class="col-eyebrow" fill="#c95a2a">EXPRESSED GENES</text>
    <g transform="translate(240,666)">
      <rect x="0" y="0" width="84" height="28" rx="6" fill="#c95a2a" opacity="0.8"></rect>
      <text x="42" y="19" text-anchor="middle" class="gene" fill="#ffffff">Trp53</text>
      <rect x="92" y="0" width="84" height="28" rx="6" fill="#c95a2a" opacity="0.8"></rect>
      <text x="134" y="19" text-anchor="middle" class="gene" fill="#ffffff">Cd3e</text>
      <rect x="184" y="0" width="84" height="28" rx="6" fill="#c95a2a" opacity="0.8"></rect>
      <text x="226" y="19" text-anchor="middle" class="gene" fill="#ffffff">Gapdh</text>
      <rect x="276" y="0" width="84" height="28" rx="6" fill="#c95a2a" opacity="0.8"></rect>
      <text x="318" y="19" text-anchor="middle" class="gene" fill="#ffffff">Foxp3</text>

      <rect x="0" y="38" width="84" height="28" rx="6" fill="#c95a2a" opacity="0.8"></rect>
      <text x="42" y="57" text-anchor="middle" class="gene" fill="#ffffff">Il2ra</text>
      <rect x="92" y="38" width="84" height="28" rx="6" fill="#c95a2a" opacity="0.8"></rect>
      <text x="134" y="57" text-anchor="middle" class="gene" fill="#ffffff">Actb</text>
      <rect x="184" y="38" width="84" height="28" rx="6" fill="#c95a2a" opacity="0.8"></rect>
      <text x="226" y="57" text-anchor="middle" class="gene" fill="#ffffff">Cd4</text>
      <text x="282" y="55" class="mono">…</text>
    </g>
    <text x="240" y="766" class="annot" font-style="italic" fill="#5c5c66">different symbols, mostly the same proteins</text>
    <text x="240" y="800" class="mono" fill="#c95a2a">genome: mm10  ·  symbols: MGI</text>
    <text x="240" y="818" class="mono" fill="#c95a2a">~ 22 000 protein-coding genes</text>
  </g>

  
  <line x1="630" y1="540" x2="675" y2="540" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <text x="700" y="200" class="col-eyebrow" fill="#6b4e8a">CENTER  ·  THE TRICK</text>
  <text x="700" y="226" class="col-title">Each gene → its protein sequence → an ESM2 embedding</text>
  <text x="700" y="246" class="col-sub">homologous proteins land in nearby vectors</text>

  
  <g>
    <rect x="700" y="290" width="600" height="120" rx="14" fill="#ebe5f0" stroke="#6b4e8a" stroke-width="2"></rect>
    <text x="1000" y="318" text-anchor="middle" class="col-eyebrow" fill="#6b4e8a">FROZEN PROTEIN LANGUAGE MODEL</text>
    <text x="1000" y="352" text-anchor="middle" class="col-title" fill="#1a1a22">ESM2</text>
    <text x="1000" y="378" text-anchor="middle" class="col-sub">trained on millions of protein sequences</text>
    <text x="1000" y="396" text-anchor="middle" class="col-sub">outputs a fixed embedding per gene — no fine-tuning</text>
  </g>

  
