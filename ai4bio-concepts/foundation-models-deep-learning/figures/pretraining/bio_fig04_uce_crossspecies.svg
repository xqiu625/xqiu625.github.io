      <circle cx="1460" cy="608" r="5" fill="#c95a2a"></circle>
      <circle cx="1456" cy="592" r="5" fill="#4a6a8a"></circle>
      <circle cx="1448" cy="614" r="5" fill="#c95a2a"></circle>
      <text x="1450" y="568" text-anchor="middle" class="mono-sm" fill="#b8902c">macrophages</text>
    </g>
  </g>

  
  <g>
    <rect x="60" y="960" width="1880" height="110" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <text x="80" y="990" class="col-eyebrow" fill="#7a5b13">THE TRICK</text>
    <text x="80" y="1024" class="key" fill="#7a5b13">No homolog mapping needed — protein-sequence similarity does the alignment automatically.</text>
    <text x="80" y="1054" class="annot">Pre-compute the ESM2 embedding once per gene per species. Any cell from any species enters as a bag of those vectors. Train one transformer on the union; both species live in the same latent space without curated ortholog tables.</text>
  </g>
</svg>