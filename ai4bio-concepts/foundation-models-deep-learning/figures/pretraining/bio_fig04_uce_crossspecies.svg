      <text x="1510" y="754" class="mono-sm" fill="#4a6a8a">human T cell</text>
      <circle cx="1500" cy="780" r="6" fill="#c95a2a" opacity="0.8"></circle>
      <text x="1510" y="784" class="mono-sm" fill="#c95a2a">mouse T cell</text>
    </g>

    
    <g>
      <ellipse cx="1820" cy="600" rx="60" ry="40" fill="#6b4e8a" opacity="0.10" stroke="#6b4e8a" stroke-width="1" stroke-dasharray="3 3"></ellipse>
      <circle cx="1810" cy="600" r="5" fill="#4a6a8a"></circle>
      <circle cx="1822" cy="590" r="5" fill="#4a6a8a"></circle>
      <circle cx="1830" cy="608" r="5" fill="#c95a2a"></circle>
      <circle cx="1815" cy="612" r="5" fill="#c95a2a"></circle>
      <text x="1820" y="568" text-anchor="middle" class="mono-sm" fill="#6b4e8a">B cells</text>
