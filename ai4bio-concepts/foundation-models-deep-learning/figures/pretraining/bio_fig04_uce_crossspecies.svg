<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c66"></path>
    </marker>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  HOW UCE TRANSFERS ACROSS SPECIES</text>
  <text x="60" y="96" class="h1">Bag-of-RNA with ESM2 gene tokens</text>
  <text x="60" y="124" class="h-sub">Each gene is replaced by its protein-sequence embedding. Homologous proteins land in nearby vectors — so the species alignment is automatic.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
  <line x1="660" y1="170" x2="660" y2="940" stroke="#e5dfcf" stroke-width="1" stroke-dasharray="6 5"></line>
  <line x1="1320" y1="170" x2="1320" y2="940" stroke="#e5dfcf" stroke-width="1" stroke-dasharray="6 5"></line>

  
  <text x="80" y="200" class="col-eyebrow" fill="#4a6a8a">LEFT  ·  INPUT</text>
  <text x="80" y="226" class="col-title">Two cells, two species</text>
  <text x="80" y="246" class="col-sub">expressed gene sets differ by name but encode similar proteins</text>

  
  <g>
    <rect x="80" y="280" width="540" height="280" rx="14" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.8"></rect>
    <text x="100" y="306" class="species-tag" fill="#4a6a8a">HUMAN  ·  T CELL</text>

    
    <g transform="translate(150,420)">
      <circle cx="0" cy="0" r="56" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"></circle>
      <circle cx="-12" cy="-8" r="20" fill="#4a6a8a" opacity="0.4"></circle>
      <text x="0" y="84" text-anchor="middle" class="col-sub">cell.X (Hs)</text>
    </g>

    
    <text x="240" y="346" class="col-eyebrow" fill="#4a6a8a">EXPRESSED GENES</text>
    <g transform="translate(240,366)">
      <rect x="0" y="0" width="84" height="28" rx="6" fill="#4a6a8a" opacity="0.8"></rect>
      <text x="42" y="19" text-anchor="middle" class="gene" fill="#ffffff">TP53</text>
      <rect x="92" y="0" width="84" height="28" rx="6" fill="#4a6a8a" opacity="0.8"></rect>
      <text x="134" y="19" text-anchor="middle" class="gene" fill="#ffffff">CD3E</text>
      <rect x="184" y="0" width="84" height="28" rx="6" fill="#4a6a8a" opacity="0.8"></rect>
      <text x="226" y="19" text-anchor="middle" class="gene" fill="#ffffff">GAPDH</text>
      <rect x="276" y="0" width="84" height="28" rx="6" fill="#4a6a8a" opacity="0.8"></rect>
      <text x="318" y="19" text-anchor="middle" class="gene" fill="#ffffff">FOXP3</text>

      <rect x="0" y="38" width="84" height="28" rx="6" fill="#4a6a8a" opacity="0.8"></rect>
      <text x="42" y="57" text-anchor="middle" class="gene" fill="#ffffff">IL2RA</text>
      <rect x="92" y="38" width="84" height="28" rx="6" fill="#4a6a8a" opacity="0.8"></rect>
      <text x="134" y="57" text-anchor="middle" class="gene" fill="#ffffff">ACTB</text>
      <rect x="184" y="38" width="84" height="28" rx="6" fill="#4a6a8a" opacity="0.8"></rect>
      <text x="226" y="57" text-anchor="middle" class="gene" fill="#ffffff">CD4</text>
      <text x="282" y="55" class="mono">…</text>
    </g>
    <text x="240" y="466" class="annot" font-style="italic" fill="#5c5c66">unordered (bag) — no rank or magnitude</text>
    <text x="240" y="500" class="mono" fill="#4a6a8a">genome: hg38  ·  symbols: HGNC</text>
    <text x="240" y="518" class="mono" fill="#4a6a8a">~ 20 000 protein-coding genes</text>
  </g>

  
  <g>
    <rect x="80" y="580" width="540" height="280" rx="14" fill="#fbe6d8" stroke="#c95a2a" stroke-width="1.8"></rect>
    <text x="100" y="606" class="species-tag" fill="#c95a2a">MOUSE  ·  T CELL</text>

    <g transform="translate(150,720)">
      <circle cx="0" cy="0" r="56" fill="#ffffff" stroke="#c95a2a" stroke-width="2"></circle>
