<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  WHY DISSOCIATED-ONLY MODELS FAIL AT SPATIAL TASKS</text>
  <text x="60" y="96" class="h1">Spatial signal must be in the pretraining data.</text>
  <text x="60" y="124" class="h-sub">Scaling up dissociated single-cell data does not give the model any concept of physical neighbors.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
  <rect x="40" y="170" width="940" height="730" rx="14" fill="#a14854" fill-opacity="0.04"></rect>
  <rect x="1020" y="170" width="940" height="730" rx="14" fill="#2c8a4f" fill-opacity="0.04"></rect>

  
  <text x="80" y="208" class="panel-tag" fill="#a14854">LEFT  ·  DISSOCIATED-ONLY PRETRAINING</text>
  <text x="80" y="244" class="panel-title">Geneformer / scGPT-style</text>
  <text x="80" y="270" class="panel-sub">cells in a dish, separated from any tissue context</text>

  
  <g>
    <rect x="80" y="300" width="860" height="320" rx="14" fill="#ffffff" stroke="#a14854" stroke-width="1.6"></rect>
    <text x="100" y="328" class="stat-label" fill="#a14854">PRETRAINING SUBSTRATE</text>
    <ellipse cx="510" cy="475" rx="380" ry="115" fill="#fbe6e6" stroke="#a14854" stroke-width="1.4" stroke-dasharray="6 4"></ellipse>
    <text x="510" y="365" text-anchor="middle" class="annot" font-style="italic" fill="#a14854">a dish — no spatial structure</text>

    
    <g>
      <circle cx="220" cy="430" r="14" fill="#4a6a8a" opacity="0.7"></circle>
      <circle cx="290" cy="490" r="14" fill="#c95a2a" opacity="0.7"></circle>
      <circle cx="360" cy="455" r="14" fill="#6b4e8a" opacity="0.7"></circle>
      <circle cx="430" cy="510" r="14" fill="#2c8a4f" opacity="0.7"></circle>
      <circle cx="500" cy="440" r="14" fill="#4a6a8a" opacity="0.7"></circle>
      <circle cx="560" cy="500" r="14" fill="#c95a2a" opacity="0.7"></circle>
      <circle cx="620" cy="450" r="14" fill="#4a6a8a" opacity="0.7"></circle>
      <circle cx="680" cy="500" r="14" fill="#2c8a4f" opacity="0.7"></circle>
      <circle cx="740" cy="460" r="14" fill="#6b4e8a" opacity="0.7"></circle>
      <circle cx="800" cy="510" r="14" fill="#c95a2a" opacity="0.7"></circle>
      <circle cx="260" cy="540" r="14" fill="#4a6a8a" opacity="0.7"></circle>
      <circle cx="340" cy="525" r="14" fill="#2c8a4f" opacity="0.7"></circle>
      <circle cx="450" cy="475" r="14" fill="#c95a2a" opacity="0.7"></circle>
      <circle cx="540" cy="545" r="14" fill="#6b4e8a" opacity="0.7"></circle>
      <circle cx="620" cy="525" r="14" fill="#4a6a8a" opacity="0.7"></circle>
      <circle cx="710" cy="540" r="14" fill="#c95a2a" opacity="0.7"></circle>
    </g>

    <text x="510" y="600" text-anchor="middle" class="annot">model learns gene co-expression patterns — but no concept of physical neighbours</text>
  </g>

  
  <g>
    <rect x="80" y="640" width="420" height="240" rx="12" fill="#ffffff" stroke="#a14854" stroke-width="1.4"></rect>
    <text x="100" y="666" class="stat-label" fill="#a14854">DOWNSTREAM PROBE</text>
    <text x="100" y="698" class="annot" font-weight="700">&#34;What niche is this cell in?&#34;</text>
    
    <g transform="translate(100,718)">
      <rect x="0" y="0" width="280" height="60" rx="10" fill="#fbe6e6" stroke="#a14854" stroke-width="1"></rect>
      <text x="140" y="26" text-anchor="middle" class="bubble" fill="#a14854">¯\_(ツ)_/¯</text>
      <text x="140" y="48" text-anchor="middle" class="annot" fill="#a14854">&#34;I never saw tissue context.&#34;</text>
    </g>
    <text x="100" y="816" class="stat-label" fill="#a14854">NICHE LABEL F1</text>
    <text x="100" y="864" class="stat-value" fill="#a14854">0.67</text>
  </g>

  
  <g>
    <rect x="520" y="640" width="420" height="240" rx="12" fill="#ffffff" stroke="#a14854" stroke-width="1.4"></rect>
    <text x="540" y="666" class="stat-label" fill="#a14854">WHAT THE MODEL HAS / LACKS</text>
    <text x="540" y="698" class="annot"><tspan font-weight="700" fill="#1a1a22">has</tspan>  ·  gene co-expression statistics</text>
    <text x="540" y="720" class="annot"><tspan font-weight="700" fill="#1a1a22">has</tspan>  ·  cell-type identity</text>
    <text x="540" y="742" class="annot"><tspan font-weight="700" fill="#1a1a22">has</tspan>  ·  marker-gene programs</text>
    <text x="540" y="768" class="annot"><tspan font-weight="700" fill="#a14854">lacks</tspan>  ·  any signal about neighbours</text>
    <text x="540" y="790" class="annot"><tspan font-weight="700" fill="#a14854">lacks</tspan>  ·  any concept of &#34;niche&#34;</text>
    <text x="540" y="812" class="annot"><tspan font-weight="700" fill="#a14854">lacks</tspan>  ·  any spatial position</text>
    <line x1="540" y1="828" x2="920" y2="828" stroke="#e7c5a8" stroke-width="1"></line>
    <text x="540" y="852" class="annot" font-style="italic" fill="#5c5c66">A bigger dish doesn&#39;t add coordinates.</text>
  </g>

  
  <text x="1040" y="208" class="panel-tag" fill="#2c8a4f">RIGHT  ·  JOINT DISSOCIATED + SPATIAL PRETRAINING</text>
  <text x="1040" y="244" class="panel-title">Nicheformer-style</text>
  <text x="1040" y="270" class="panel-sub">same cells, plus their tissue-section context</text>

  
  <g>
    <rect x="1060" y="300" width="860" height="320" rx="14" fill="#ffffff" stroke="#2c8a4f" stroke-width="1.6"></rect>
    <text x="1080" y="328" class="stat-label" fill="#2c8a4f">PRETRAINING SUBSTRATE</text>
    <text x="1490" y="365" text-anchor="middle" class="annot" font-style="italic" fill="#2c8a4f">a tissue section — layered, structured</text>

    
    <g>
      <rect x="1080" y="385" width="820" height="220" rx="8" fill="#dfeede" opacity="0.4" stroke="#2c8a4f" stroke-width="1"></rect>
      
      <line x1="1080" y1="438" x2="1900" y2="438" stroke="#2c8a4f" stroke-width="0.8" stroke-dasharray="3 3"></line>
      <line x1="1080" y1="498" x2="1900" y2="498" stroke="#2c8a4f" stroke-width="0.8" stroke-dasharray="3 3"></line>
      <line x1="1080" y1="558" x2="1900" y2="558" stroke="#2c8a4f" stroke-width="0.8" stroke-dasharray="3 3"></line>

      <text x="1100" y="408" class="mono" fill="#5c5c66">layer 1 (epithelial)</text>
      <text x="1100" y="468" class="mono" fill="#5c5c66">layer 2 (stromal)</text>
      <text x="1100" y="528" class="mono" fill="#5c5c66">layer 3 (immune-rich)</text>
      <text x="1100" y="588" class="mono" fill="#5c5c66">layer 4 (vascular)</text>

      
      <g>
        
        <circle cx="1300" cy="412" r="8" fill="#4a6a8a"></circle>
        <circle cx="1340" cy="418" r="8" fill="#4a6a8a"></circle>
        <circle cx="1380" cy="412" r="8" fill="#4a6a8a"></circle>
        <circle cx="1420" cy="418" r="8" fill="#4a6a8a"></circle>
        <circle cx="1460" cy="412" r="8" fill="#4a6a8a"></circle>
        <circle cx="1500" cy="420" r="8" fill="#4a6a8a"></circle>
        <circle cx="1540" cy="414" r="8" fill="#4a6a8a"></circle>
        
        <circle cx="1300" cy="472" r="8" fill="#6b4e8a"></circle>
        <circle cx="1360" cy="476" r="8" fill="#6b4e8a"></circle>
        <circle cx="1420" cy="472" r="8" fill="#6b4e8a"></circle>
        <circle cx="1480" cy="476" r="8" fill="#6b4e8a"></circle>
        <circle cx="1540" cy="472" r="8" fill="#6b4e8a"></circle>
        <circle cx="1600" cy="476" r="8" fill="#6b4e8a"></circle>
        
        <circle cx="1320" cy="532" r="8" fill="#c95a2a"></circle>
        <circle cx="1360" cy="528" r="8" fill="#c95a2a"></circle>
        <circle cx="1400" cy="535" r="8" fill="#c95a2a"></circle>
        <circle cx="1440" cy="528" r="8" fill="#c95a2a"></circle>
        <circle cx="1480" cy="535" r="8" fill="#c95a2a"></circle>
        <circle cx="1520" cy="528" r="8" fill="#c95a2a"></circle>
        <circle cx="1560" cy="535" r="8" fill="#c95a2a"></circle>
        <circle cx="1600" cy="528" r="8" fill="#c95a2a"></circle>
        
        <circle cx="1340" cy="588" r="8" fill="#2c8a4f"></circle>
        <circle cx="1400" cy="592" r="8" fill="#2c8a4f"></circle>
        <circle cx="1460" cy="588" r="8" fill="#2c8a4f"></circle>
        <circle cx="1520" cy="592" r="8" fill="#2c8a4f"></circle>
        <circle cx="1580" cy="588" r="8" fill="#2c8a4f"></circle>
        <circle cx="1640" cy="592" r="8" fill="#2c8a4f"></circle>
      </g>
    </g>
  </g>

  
  <g>
    <rect x="1060" y="640" width="420" height="240" rx="12" fill="#ffffff" stroke="#2c8a4f" stroke-width="1.4"></rect>
    <text x="1080" y="666" class="stat-label" fill="#2c8a4f">DOWNSTREAM PROBE</text>
    <text x="1080" y="698" class="annot" font-weight="700">&#34;What niche is this cell in?&#34;</text>
    <g transform="translate(1080,718)">
      <rect x="0" y="0" width="280" height="60" rx="10" fill="#dfeede" stroke="#2c8a4f" stroke-width="1"></rect>
      <text x="140" y="26" text-anchor="middle" class="bubble" fill="#2c8a4f">stromal layer 2</text>
      <text x="140" y="48" text-anchor="middle" class="annot" fill="#2c8a4f">&#34;with confidence.&#34;</text>
    </g>
    <text x="1080" y="816" class="stat-label" fill="#2c8a4f">NICHE LABEL F1</text>
    <text x="1080" y="864" class="stat-value" fill="#2c8a4f">0.82</text>
  </g>

  <g>
    <rect x="1500" y="640" width="420" height="240" rx="12" fill="#ffffff" stroke="#2c8a4f" stroke-width="1.4"></rect>
    <text x="1520" y="666" class="stat-label" fill="#2c8a4f">WHAT CHANGED</text>
    <text x="1520" y="698" class="annot">•  cells now carry  <tspan font-weight="700">spatial position</tspan></text>
    <text x="1520" y="720" class="annot">•  attention picks up  <tspan font-weight="700">neighbour identities</tspan></text>
    <text x="1520" y="742" class="annot">•  the model learns niches, not just types</text>
    <text x="1520" y="764" class="annot">•  same architecture, different data</text>
    <line x1="1520" y1="788" x2="1900" y2="788" stroke="#bcd6bc" stroke-width="1"></line>
    <text x="1520" y="812" class="annot" font-weight="700" fill="#2c8a4f">+0.15 F1  vs  dissociated-only</text>
    <text x="1520" y="844" class="annot" font-style="italic" fill="#5c5c66">The gain comes from the modality, not from</text>
    <text x="1520" y="862" class="annot" font-style="italic" fill="#5c5c66">the model.</text>
  </g>

  
  <g>
    <rect x="60" y="930" width="1880" height="140" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <text x="80" y="960" class="stat-label" fill="#7a5b13">THE TAKEAWAY</text>
    <text x="80" y="994" class="key" fill="#7a5b13">Adding more dissociated cells does NOT fix this.</text>
    <text x="80" y="1024" class="annot">Spatial signal must be in the pretraining data. No amount of scale on the left turns the dish into a tissue section.</text>
    <text x="80" y="1052" class="annot" font-style="italic" fill="#5c5c66">If you need niche-level predictions, train on data with niches in it. The architecture is not the bottleneck.</text>
  </g>
</svg>