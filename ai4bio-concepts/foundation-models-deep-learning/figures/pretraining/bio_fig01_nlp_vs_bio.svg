<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c66"></path>
    </marker>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  NLP PRETRAINING vs BIOLOGICAL PRETRAINING</text>
  <text x="60" y="96" class="h1">Same architecture, very different data realities.</text>
  <text x="60" y="124" class="h-sub">Both rows pass a masked input through a transformer to predict the missing token — but the bottom row pays for every assumption the top row gets for free.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
  <text x="80" y="200" class="row-tag" fill="#4a6a8a">TOP ROW  ·  NLP</text>
  <text x="80" y="234" class="row-title">Masked language modeling</text>

  
  <g>
    <rect x="60" y="280" width="500" height="110" rx="12" fill="#e3edf6" stroke="#4a6a8a" stroke-width="1.8"></rect>
    <text x="80" y="306" class="node-sub" fill="#4a6a8a">INPUT  ·  CLEAN, ABUNDANT, SINGLE-MODALITY</text>
    <text x="80" y="342" class="mono">The cat sat on the  <tspan font-weight="700" fill="#c95a2a">[MASK]</tspan></text>
    <text x="80" y="370" class="node-sub">a complete sentence, well-formed English</text>
  </g>

  <line x1="565" y1="335" x2="615" y2="335" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <g>
    <rect x="620" y="280" width="300" height="110" rx="12" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"></rect>
    <text x="770" y="306" text-anchor="middle" class="node-sub" fill="#4a6a8a">SAME ARCHITECTURE</text>
    <text x="770" y="340" text-anchor="middle" class="node-title">Transformer encoder</text>
    <text x="770" y="362" text-anchor="middle" class="node-sub">self-attention over tokens</text>
  </g>

  <line x1="925" y1="335" x2="975" y2="335" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  
  <g>
    <rect x="980" y="280" width="320" height="110" rx="12" fill="#dfeede" stroke="#2c8a4f" stroke-width="1.8"></rect>
    <text x="1000" y="306" class="node-sub" fill="#2c8a4f">OUTPUT  ·  PREDICTED TOKEN</text>
    <text x="1000" y="342" class="mono"><tspan font-weight="700" fill="#1a1a22">&#34;mat&#34;</tspan>   (p = 0.81)</text>
    <text x="1000" y="370" class="node-sub">single best-guess from a known vocab</text>
  </g>

  
  <g>
    <rect x="1340" y="240" width="600" height="190" rx="12" fill="#ffffff" stroke="#d8d5cb" stroke-width="1"></rect>
    <text x="1360" y="268" class="node-sub" fill="#4a6a8a">WHAT NLP GETS FOR FREE</text>
    <text x="1360" y="296" class="warn-body"><tspan font-weight="700">✓</tspan>  abundant data  —  trillions of tokens on the open web</text>
    <text x="1360" y="320" class="warn-body"><tspan font-weight="700">✓</tspan>  single modality  —  all of it is text</text>
    <text x="1360" y="344" class="warn-body"><tspan font-weight="700">✓</tspan>  one grammar  —  English syntax is the same everywhere</text>
    <text x="1360" y="368" class="warn-body"><tspan font-weight="700">✓</tspan>  no platform confounding  —  bytes are bytes</text>
    <text x="1360" y="396" class="warn-body" font-style="italic" fill="#5c5c66">Architecture choices generalize across the entire corpus.</text>
  </g>

  
  <line x1="60" y1="470" x2="1940" y2="470" stroke="#e5dfcf" stroke-width="1.5" stroke-dasharray="6 5"></line>

  
  <text x="80" y="510" class="row-tag" fill="#c95a2a">BOTTOM ROW  ·  SINGLE-CELL BIOLOGY</text>
  <text x="80" y="544" class="row-title">Masked gene expression modeling</text>

  
  <g>
    <rect x="60" y="590" width="500" height="170" rx="12" fill="#fbe6d8" stroke="#c95a2a" stroke-width="1.8"></rect>
    <text x="80" y="616" class="node-sub" fill="#c95a2a">INPUT  ·  SPARSE COUNT VECTOR FROM ONE CELL</text>

    
    <g transform="translate(102,684)">
      <circle cx="0" cy="0" r="36" fill="#ffe7d6" stroke="#c95a2a" stroke-width="1.8"></circle>
      <circle cx="-6" cy="-4" r="11" fill="#c95a2a" opacity="0.6"></circle>
      <text x="0" y="62" text-anchor="middle" class="node-sub">one cell</text>
    </g>

    
    <g transform="translate(170,664)">
      <rect x="0" y="0" width="36" height="36" fill="#ffffff" stroke="#c95a2a" stroke-width="1"></rect>
      <text x="18" y="22" text-anchor="middle" class="mono-sm">0</text>
      <rect x="40" y="0" width="36" height="36" fill="#ffffff" stroke="#c95a2a" stroke-width="1"></rect>
      <text x="58" y="22" text-anchor="middle" class="mono-sm">7</text>
      <rect x="80" y="0" width="36" height="36" fill="#ffffff" stroke="#c95a2a" stroke-width="1"></rect>
      <text x="98" y="22" text-anchor="middle" class="mono-sm">0</text>
      <rect x="120" y="0" width="36" height="36" fill="#fbe6e6" stroke="#a14854" stroke-width="2"></rect>
      <text x="138" y="22" text-anchor="middle" class="mono-sm" font-weight="700" fill="#a14854">?</text>
      <rect x="160" y="0" width="36" height="36" fill="#ffffff" stroke="#c95a2a" stroke-width="1"></rect>
      <text x="178" y="22" text-anchor="middle" class="mono-sm">42</text>
      <rect x="200" y="0" width="36" height="36" fill="#ffffff" stroke="#c95a2a" stroke-width="1"></rect>
      <text x="218" y="22" text-anchor="middle" class="mono-sm">0</text>
      <rect x="240" y="0" width="36" height="36" fill="#ffffff" stroke="#c95a2a" stroke-width="1"></rect>
      <text x="258" y="22" text-anchor="middle" class="mono-sm">1</text>
      <rect x="280" y="0" width="36" height="36" fill="#ffffff" stroke="#c95a2a" stroke-width="1"></rect>
      <text x="298" y="22" text-anchor="middle" class="mono-sm">0</text>
      <text x="328" y="22" class="mono-sm">…</text>
    </g>
    <text x="80" y="744" class="node-sub">~19 000-dim vector, mostly zeros; one gene masked</text>
  </g>

  <line x1="565" y1="675" x2="615" y2="675" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  <g>
    <rect x="620" y="620" width="300" height="110" rx="12" fill="#ffffff" stroke="#c95a2a" stroke-width="2"></rect>
    <text x="770" y="646" text-anchor="middle" class="node-sub" fill="#c95a2a">SAME ARCHITECTURE</text>
    <text x="770" y="680" text-anchor="middle" class="node-title">Transformer encoder</text>
    <text x="770" y="702" text-anchor="middle" class="node-sub">self-attention over gene tokens</text>
  </g>
  <text x="770" y="752" text-anchor="middle" class="same">↑   identical to the NLP row above   ↑</text>

  <line x1="925" y1="675" x2="975" y2="675" stroke="#5c5c66" stroke-width="2.5" marker-end="url(#ar)"></line>

  <g>
    <rect x="980" y="620" width="320" height="110" rx="12" fill="#dfeede" stroke="#2c8a4f" stroke-width="1.8"></rect>
    <text x="1000" y="646" class="node-sub" fill="#2c8a4f">OUTPUT  ·  PREDICTED EXPRESSION</text>
    <text x="1000" y="682" class="mono"><tspan font-weight="700" fill="#1a1a22">CD3E ≈ 12 UMI</tspan></text>
    <text x="1000" y="710" class="node-sub">a real-valued count, not a categorical token</text>
  </g>

  
  <g>
    <rect x="1340" y="580" width="600" height="180" rx="12" fill="#ffffff" stroke="#a14854" stroke-width="1.5"></rect>
    <text x="1360" y="608" class="warn-tag">⚠  THREE COMPLICATIONS THE BIO ROW PAYS FOR</text>

    <g transform="translate(1360,628)">
      <circle cx="10" cy="14" r="11" fill="#a14854"></circle>
      <text x="10" y="19" text-anchor="middle" class="warn-body" font-weight="700" fill="#ffffff">1</text>
      <text x="32" y="14" class="warn-body" font-weight="700">Sparse &amp; noisy</text>
      <text x="32" y="32" class="warn-body" fill="#5c5c66">dropout zeros, UMI variation across protocols</text>
    </g>
    <g transform="translate(1360,680)">
      <circle cx="10" cy="14" r="11" fill="#a14854"></circle>
      <text x="10" y="19" text-anchor="middle" class="warn-body" font-weight="700" fill="#ffffff">2</text>
      <text x="32" y="14" class="warn-body" font-weight="700">No single grammar</text>
      <text x="32" y="32" class="warn-body" fill="#5c5c66">regulation differs by cell type and by species</text>
    </g>
    <g transform="translate(1360,732)">
      <circle cx="10" cy="14" r="11" fill="#a14854"></circle>
      <text x="10" y="19" text-anchor="middle" class="warn-body" font-weight="700" fill="#ffffff">3</text>
      <text x="32" y="14" class="warn-body" font-weight="700">Platform-confounded</text>
      <text x="32" y="32" class="warn-body" fill="#5c5c66">10× vs Smart-seq vs spatial — same cell, different vectors</text>
    </g>
  </g>

  
  <g>
    <rect x="60" y="820" width="1880" height="240" rx="14" fill="#ffffff" stroke="#d8d5cb" stroke-width="1"></rect>
    <text x="80" y="854" class="row-tag" fill="#8a5a4a">THE TAKEAWAY</text>
    <text x="80" y="892" class="row-title">Architecture transfers; data assumptions don&#39;t.</text>
    <text x="80" y="930" class="warn-body">The transformer block is the same in both rows. What changes is everything around it — the input is sparse and noisy, no canonical &#34;grammar&#34; exists across cell types and species, and platform</text>
    <text x="80" y="952" class="warn-body">choices (10× vs Smart-seq vs spatial) inject confounds the model would never see in NLP.</text>
    <line x1="80" y1="976" x2="1920" y2="976" stroke="#e5dfcf" stroke-width="1"></line>
    <text x="80" y="1004" class="warn-body" font-style="italic" fill="#5c5c66">Most design choices in single-cell foundation models — tokenisation, normalisation, batch handling — exist to absorb these three complications before the transformer sees the data.</text>
    <text x="80" y="1032" class="warn-body" font-style="italic" fill="#5c5c66">Copying NLP recipes verbatim ignores them, which is why &#34;just scale it up&#34; doesn&#39;t work the same way in biology.</text>
  </g>
</svg>