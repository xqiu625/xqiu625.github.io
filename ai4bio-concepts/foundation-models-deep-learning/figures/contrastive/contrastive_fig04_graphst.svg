      <line x1="60" y1="54" x2="60" y2="106" stroke="#2c8a4f" stroke-width="1.4"></line>
      <line x1="160" y1="54" x2="160" y2="106" stroke="#2c8a4f" stroke-width="1.4"></line>
      <line x1="260" y1="54" x2="260" y2="106" stroke="#2c8a4f" stroke-width="1.4"></line>
      <line x1="60" y1="134" x2="60" y2="186" stroke="#2c8a4f" stroke-width="1.4"></line>
      <line x1="160" y1="134" x2="160" y2="186" stroke="#2c8a4f" stroke-width="1.4"></line>
      <line x1="260" y1="134" x2="260" y2="186" stroke="#2c8a4f" stroke-width="1.4"></line>

      <text x="380" y="44" class="annot" font-weight="700">→  GNN  🧠</text>
      <text x="380" y="78" class="annot">node embeddings  z_i</text>
      <text x="380" y="118" class="annot" font-weight="700">→  pool  Σ</text>
