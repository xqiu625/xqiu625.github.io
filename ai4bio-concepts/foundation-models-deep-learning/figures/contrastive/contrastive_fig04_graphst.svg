      <text x="700" y="50" class="annot" fill="#5c5c66">= cells / spots, with gene-expression features</text>
      <text x="620" y="80" class="annot" font-weight="700">edges</text>
      <text x="700" y="80" class="annot" fill="#5c5c66">= k-NN within a radius</text>
