  <text x="80" y="546" class="panel-tag" fill="#2c8a4f">STEP 2  ·  THE DGI CONTRASTIVE TASK  🎲</text>
  <text x="80" y="578" class="panel-title">real graph vs corrupted graph  ·  same topology, shuffled features</text>

  
  <g>
