  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  GRAPHST  ·  GRAPH CONTRASTIVE LEARNING FOR SPATIAL TISSUE</text>
  <text x="60" y="96" class="h1">Real graph vs shuffled graph. The contrast is the lesson.</text>
  <text x="60" y="124" class="h-sub">Build a spatial graph, corrupt it by shuffling node features, train a GNN to tell them apart. Tissue architecture falls out for free.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
