<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20in" height="11in" viewBox="0 0 2000 1100" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif">
  <defs>
    <marker id="ar-attract" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c8a4f"></path>
    </marker>
    <marker id="ar-repel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a14854"></path>
    </marker>
    
  </defs>
  <rect width="2000" height="1100" fill="#f7f5f0"></rect>

  <text x="60" y="56" class="eyebrow">FIGURE  |  THE FOUR CONTRASTIVE FAMILIES</text>
  <text x="60" y="96" class="h1">Same core loss. Four different ways to choose a positive pair.</text>
  <text x="60" y="124" class="h-sub">The architecture follows from the pair definition — not the other way around.</text>
  <line x1="60" y1="148" x2="1940" y2="148" stroke="#d8d5cb" stroke-width="1"></line>

  
  <line x1="1000" y1="170" x2="1000" y2="980" stroke="#e5dfcf" stroke-width="1" stroke-dasharray="6 5"></line>
  <line x1="60" y1="560" x2="1940" y2="560" stroke="#e5dfcf" stroke-width="1" stroke-dasharray="6 5"></line>

  
  <g>
    <text x="80" y="208" class="cell-tag" fill="#4a6a8a">FAMILY 1  ·  INSTANCE DISCRIMINATION  🧬</text>
    <text x="80" y="244" class="cell-title">SimCLR / NT-Xent</text>
    <text x="80" y="266" class="cell-sub">positive = two augmented views of the <tspan font-style="italic">same</tspan> cell</text>

    <g transform="translate(80,300)">
      
      <circle cx="60" cy="50" r="32" fill="#ffe7d6" stroke="#c95a2a" stroke-width="1.6"></circle>
      <text x="60" y="62" text-anchor="middle" class="emoji">🦠</text>
      <text x="60" y="106" text-anchor="middle" class="annot" font-style="italic" fill="#5c5c66">one cell</text>

      
      <text x="130" y="56" class="annot">→ dropout →</text>
      <circle cx="280" cy="20" r="20" fill="#dfeede" stroke="#2c8a4f"></circle>
      <text x="280" y="26" text-anchor="middle" class="emoji-sm">🧬</text>
      <text x="280" y="-2" text-anchor="middle" class="pos">view A</text>

      <circle cx="280" cy="80" r="20" fill="#dfeede" stroke="#2c8a4f"></circle>
      <text x="280" y="86" text-anchor="middle" class="emoji-sm">🧬</text>
      <text x="280" y="116" text-anchor="middle" class="pos">view B</text>

      <text x="320" y="56" class="annot">→ encoder →</text>

      <circle cx="460" cy="50" r="14" fill="#2c8a4f"></circle>
      <circle cx="490" cy="50" r="14" fill="#2c8a4f" opacity="0.6"></circle>
      <path d="M 474 50 L 482 50" stroke="#2c8a4f" stroke-width="2" marker-end="url(#ar-attract)"></path>
      <text x="476" y="32" text-anchor="middle" class="pos">attract  💚</text>
    </g>

    <text x="80" y="466" class="key" fill="#4a6a8a">biology example  ·  Concerto</text>
    <text x="80" y="488" class="annot" fill="#5c5c66">10 M cells  ·  mapped in seconds  ·  exponential-moving-average teacher</text>
    <text x="80" y="514" class="annot" font-style="italic" fill="#5c5c66">learns invariance to dropout noise; great for batch correction.</text>
  </g>

  
  <g>
    <text x="1020" y="208" class="cell-tag" fill="#c95a2a">FAMILY 2  ·  CROSS-MODAL  (CLIP / InfoNCE)  🖼️ ↔ 🧬</text>
    <text x="1020" y="244" class="cell-title">two encoders, one shared space</text>
    <text x="1020" y="266" class="cell-sub">positive = matched (image, expression) pair from the same spot</text>

    <g transform="translate(1020,300)">
      
      <rect x="0" y="20" width="120" height="80" rx="8" fill="#ebe5f0" stroke="#6b4e8a" stroke-width="1.4"></rect>
      <circle cx="30" cy="50" r="8" fill="#a14854" opacity="0.7"></circle>
      <circle cx="60" cy="40" r="7" fill="#6b4e8a" opacity="0.7"></circle>
      <circle cx="90" cy="60" r="8" fill="#a14854" opacity="0.6"></circle>
      <circle cx="50" cy="80" r="6" fill="#6b4e8a" opacity="0.7"></circle>
      <text x="60" y="120" text-anchor="middle" class="annot" font-style="italic" fill="#5c5c66">H&amp;E patch 🖼️</text>

      
      <rect x="150" y="20" width="120" height="80" rx="8" fill="#dfeede" stroke="#2c8a4f" stroke-width="1.4"></rect>
      <rect x="160" y="80" width="10" height="10" fill="#2c8a4f"></rect>
      <rect x="175" y="60" width="10" height="30" fill="#2c8a4f"></rect>
      <rect x="190" y="40" width="10" height="50" fill="#2c8a4f"></rect>
      <rect x="205" y="68" width="10" height="22" fill="#2c8a4f"></rect>
      <rect x="220" y="48" width="10" height="42" fill="#2c8a4f"></rect>
      <rect x="235" y="56" width="10" height="34" fill="#2c8a4f"></rect>
      <rect x="250" y="76" width="10" height="14" fill="#2c8a4f"></rect>
      <text x="210" y="120" text-anchor="middle" class="annot" font-style="italic" fill="#5c5c66">gene expression 🧬</text>

      <text x="300" y="64" class="annot">→ joint embedding</text>
      <text x="300" y="84" class="annot" font-style="italic" fill="#5c5c66">N × N similarity matrix; diagonal pulled together</text>
    </g>

    <text x="1020" y="466" class="key" fill="#c95a2a">biology example  ·  OmiCLIP</text>
    <text x="1020" y="488" class="annot" fill="#5c5c66">2.2 M paired image–transcriptome pairs  ·  Loki platform downstream</text>
    <text x="1020" y="514" class="annot" font-style="italic" fill="#5c5c66">crosses modalities by matching what was observed at the same place.</text>
  </g>

  
  <g>
    <text x="80" y="598" class="cell-tag" fill="#2c8a4f">FAMILY 3  ·  GRAPH CONTRASTIVE  (DGI)  🕸️</text>
    <text x="80" y="634" class="cell-title">real graph vs shuffled graph</text>
    <text x="80" y="656" class="cell-sub">positive = node embedding vs the <tspan font-style="italic">real</tspan> graph summary</text>

    <g transform="translate(80,690)">
      
      <g>
        <circle cx="20" cy="40" r="12" fill="#2c8a4f"></circle>
        <circle cx="80" cy="20" r="12" fill="#2c8a4f"></circle>
        <circle cx="140" cy="50" r="12" fill="#2c8a4f"></circle>
        <circle cx="60" cy="90" r="12" fill="#2c8a4f"></circle>
        <circle cx="120" cy="100" r="12" fill="#2c8a4f"></circle>
        <line x1="32" y1="40" x2="68" y2="20" stroke="#2c8a4f" stroke-width="1.4"></line>
        <line x1="92" y1="20" x2="128" y2="50" stroke="#2c8a4f" stroke-width="1.4"></line>
        <line x1="32" y1="48" x2="48" y2="82" stroke="#2c8a4f" stroke-width="1.4"></line>
        <line x1="72" y1="90" x2="108" y2="100" stroke="#2c8a4f" stroke-width="1.4"></line>
        <line x1="140" y1="62" x2="120" y2="88" stroke="#2c8a4f" stroke-width="1.4"></line>
        <text x="80" y="138" text-anchor="middle" class="annot" font-style="italic" fill="#5c5c66">real graph  ✅</text>
      </g>

      <text x="200" y="64" class="annot">vs</text>

      
      <g transform="translate(240,0)">
        <circle cx="20" cy="40" r="12" fill="#a14854"></circle>
        <circle cx="80" cy="20" r="12" fill="#a14854"></circle>
        <circle cx="140" cy="50" r="12" fill="#a14854"></circle>
        <circle cx="60" cy="90" r="12" fill="#a14854"></circle>
        <circle cx="120" cy="100" r="12" fill="#a14854"></circle>
        <line x1="32" y1="40" x2="68" y2="20" stroke="#a14854" stroke-width="1.4"></line>
        <line x1="92" y1="20" x2="128" y2="50" stroke="#a14854" stroke-width="1.4"></line>
        <line x1="32" y1="48" x2="48" y2="82" stroke="#a14854" stroke-width="1.4"></line>
        <line x1="72" y1="90" x2="108" y2="100" stroke="#a14854" stroke-width="1.4"></line>
        <line x1="140" y1="62" x2="120" y2="88" stroke="#a14854" stroke-width="1.4"></line>
        <text x="80" y="138" text-anchor="middle" class="annot" font-style="italic" fill="#a14854">shuffled features  🔀</text>
      </g>
    </g>

    <text x="80" y="876" class="key" fill="#2c8a4f">biology example  ·  GraphST</text>
    <text x="80" y="898" class="annot" fill="#5c5c66">DLPFC cortical layers recovered cleanly  ·  L6 / white matter boundary preserved</text>
    <text x="80" y="924" class="annot" font-style="italic" fill="#5c5c66">encodes <tspan font-weight="700">topology</tspan> — useful for niche identification and tissue architecture.</text>
  </g>

  
  <g>
    <text x="1020" y="598" class="cell-tag" fill="#6b4e8a">FAMILY 4  ·  SUPERVISED CONTRASTIVE  🏷</text>
    <text x="1020" y="634" class="cell-title">labels define the pairs</text>
    <text x="1020" y="656" class="cell-sub">positive = same class  ·  even when the inputs look almost identical</text>

    <g transform="translate(1020,690)">
      
      <rect x="0" y="20" width="240" height="56" rx="8" fill="#fbe6e6" stroke="#a14854" stroke-width="1.6"></rect>
      <text x="120" y="48" text-anchor="middle" class="annot" font-weight="700" fill="#a14854">cancer peptide  🧪</text>
      <text x="120" y="66" text-anchor="middle" class="mono" fill="#a14854">YLQPRT[<tspan font-weight="700">F</tspan>]L</text>

      
      <rect x="260" y="20" width="240" height="56" rx="8" fill="#dfeede" stroke="#2c8a4f" stroke-width="1.6"></rect>
      <text x="380" y="48" text-anchor="middle" class="annot" font-weight="700" fill="#2c8a4f">wild-type peptide  🧬</text>
      <text x="380" y="66" text-anchor="middle" class="mono" fill="#2c8a4f">YLQPRT[<tspan font-weight="700">L</tspan>]L</text>

      
      <text x="250" y="96" text-anchor="middle" class="annot" font-style="italic" fill="#5c5c66">differ by 1 amino acid  ⚛</text>

      
      <line x1="240" y1="48" x2="260" y2="48" stroke="#a14854" stroke-width="3" stroke-dasharray="4 3" marker-end="url(#ar-repel)"></line>
      <text x="250" y="36" text-anchor="middle" class="neg">repel  ❌</text>

      
      <text x="0" y="138" class="annot" fill="#5c5c66" font-style="italic">contrastive loss creates geometric separation</text>
      <text x="0" y="156" class="annot" fill="#5c5c66" font-style="italic">classification loss cannot find alone.</text>
    </g>

    <text x="1020" y="876" class="key" fill="#6b4e8a">biology example  ·  ImmunoStruct</text>
    <text x="1020" y="898" class="annot" fill="#5c5c66">separates immunogenic neoepitopes from their wild-type counterparts</text>
    <text x="1020" y="924" class="annot" font-style="italic" fill="#5c5c66">use when inputs look identical but labels are different.</text>
  </g>

  
  <g>
    <rect x="60" y="990" width="1880" height="90" rx="14" fill="#fff7d9" stroke="#b8902c" stroke-width="2"></rect>
    <text x="80" y="1018" class="cell-tag" fill="#7a5b13">PICK YOUR FAMILY</text>
    <text x="80" y="1050" class="key" fill="#7a5b13">one cell, two views (Family 1)  ·  two modalities (Family 2)  ·  graph structure (Family 3)  ·  class labels (Family 4)</text>
    <text x="80" y="1072" class="annot" font-style="italic" fill="#5c5c66">the rest of the recipe follows from this single decision.</text>
  </g>
</svg>